    <script>
        var geid = document.getElementById.bind(document);

        function loadRemote(addr, f, err) {
            var xhttp = new XMLHttpRequest();
            xhttp.addEventListener("load", function () { if (this.status != 200) err.bind(this)(); else f.bind(this)(); });
            if (err) xhttp.addEventListener("error", err);
            xhttp.open("GET", addr);
            xhttp.setRequestHeader('x-Date', Math.floor((new Date().getTime()) / 1000));
            xhttp.send();
        }

        window.onload = function () {
            console.log("loading");
            loadDataFile();
        };

        var loadingData = false;

        function loadDataFile() {
            if (loadingData) return;
            loadingData = true;
            var timing = new Date().getTime();
            loadRemote('../dataSub.txt', function () {
                    loadingData = false;
                    console.log('data load delay:' + (new Date().getTime() - timing) / 1000);
                    dataLoaded.bind(this)(this.response);
                }
                , function () { loadingData = false; geid("content").disabled = true; });
        }

        function removeConsecutiveDuplicates(td) {
            let lines = td.split('\n');
            let out = [];
            for (let i = 0; i < lines.length; i++) {
                if (i === 0 || lines[i] !== lines[i - 1]) {
                    out.push(lines[i]);
                }
            }
            return out.join('\n');
        }

        function dataLoaded(tdata) {
            geid("textcontent").value = tdata;

            setTimeout(() => {

                let ts = Date.now(), ts2;

                let tdata2 = removeCancels(tdata);

                ts2 = Date.now();
                console.log("removeCancels: " + (ts2-ts) + " ms");
                ts = ts2;

                let tdata3 = removeConsecutiveDuplicates(tdata2);

                ts2 = Date.now();
                console.log("removeConsecutiveDuplicates: " + (ts2-ts) + " ms");
                ts = ts2;

                processData(tdata3);

            }, 10);
        }

        function splitIntoLines(td) {
            let ntd = td.replaceAll("\r", "")
            return ntd.split("\n");
        }

        function splitLine(line) {
            let sub = line.split(",");
            if (sub.length != 4) {
                throw new Error("Line has more or less than 4 fields!");
            }
            for (let n = 0; n < sub.length; n++) {
                sub[n] = sub[n].trim();
            }
            sub[2] = sub[2].toLowerCase();
            if (sub[2] == "cancel") sub[3] = sub[3].toLowerCase();
            return sub;
        }

        function removeCancels(td) {
            let ts0 = Date.now();
            let tde = splitIntoLines(td);
            let toremove = new Set();

            for (let r = 0; r < tde.length; r++) {
                if (tde[r].length == 0) continue;
                let sub = splitLine(tde[r]);

                if (sub[2] == "cancel") {
                    for (let k = r - 1; k >= 0; k--) {
                        if (toremove.has(k)) continue;

                        let ksub = tde[k].split(",");
                        if (ksub[1] == sub[1] && (ksub[2] == sub[3] || (sub[3] == "" && ksub[2] != "cancel"))) {
                            toremove.add(k);
                            toremove.add(r);
                            break;
                        }
                    }
                }
            }

            if (toremove.size > 0) {
                let out = [];
                for (let i = 0; i < tde.length; i++) {
                    if (!toremove.has(i)) out.push(tde[i]);
                }
                return out.join("\n");
            }
            let ret=tde.join("\n");
            console.log("remove cancels " + (Date.now()-ts0) + " ms");
            return ret;
        }

        function renderTableHTML() {
            let ts = Date.now(), ts2;

            let table = document.getElementById("dataTable");
            let thead = table.getElementsByTagName("thead")[0];
            let tbody = table.getElementsByTagName("tbody")[0];

            ts2 = Date.now();
            console.log("renderTable header0.1: " + (ts2-ts) + " ms");
            ts = ts2;

            let row ;

            let searchableText = "";

                tr = document.createElement("tr");

            tbody.appendChild(frag);

            ts2 = Date.now();
            console.log("renderTable append: " + (ts2-ts) + " ms");
            ts = ts2;

            applySearch();

            ts2 = Date.now();
            console.log("renderTable search: " + (ts2-ts) + " ms");

            console.log("renderTable total: " + (ts2-Date.now()+0) + " ms");

        }

        function renderTableHTML2() {
            let ts0 = Date.now(); // Absolute start time for total calculation
            let ts = ts0, ts2;

            let table = document.getElementById("dataTable");
            let thead = table.getElementsByTagName("thead")[0];
            let tbody = table.getElementsByTagName("tbody")[0];

            if (!window.tableData || window.tableData.length === 0) return;

            // 1. Build Header (DOM method is fine here since it's just 1 row and needs onclick events)
            let headers = window.tableData[0];
            thead.innerHTML = "";
            let trHeader = document.createElement("tr");
            for (let i = 0; i < headers.length; i++) {
                let th = document.createElement("th");
                th.textContent = headers[i] + (currentSort.col === i ? (currentSort.dir === 1 ? " \u25B2" : " \u25BC") : "");
                th.style.cursor = "pointer";
                th.onclick = function () { sortTable(i); };
                trHeader.appendChild(th);
            }
            thead.appendChild(trHeader);

            ts2 = Date.now();
            console.log("renderTable header: " + (ts2-ts) + " ms");
            ts = ts2;

            // 2. Build the Body as a single string using direct concatenation
            let rowsHTML = "";

            for (let r = 1; r < window.tableData.length; r++) {
                let row = window.tableData[r];
                let cellsHTML = "";
                let searchableText = "";

                for (let c = 0; c < headers.length; c++) {
                    let cellVal = row[c];
                    if (cellVal === undefined || cellVal === null) cellVal = "";

                    // Escape HTML characters to prevent rendering issues when using innerHTML
                    let safeVal = String(cellVal)
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;");

                    cellsHTML += "<td>" + safeVal + "</td>";
                    searchableText += cellVal + " ";
                }

                // Escape quotes so the dataset attribute doesn't break
                let safeSearchText = searchableText.toLowerCase()
                    .replace(/'/g, "&#39;")
                    .replace(/"/g, "&quot;");

                rowsHTML += "<tr data-rowtext='" + safeSearchText + "'>" + cellsHTML + "</tr>";
            }

            ts2 = Date.now();
            console.log("renderTable string building: " + (ts2-ts) + " ms");
            ts = ts2;

            // 3. Inject the single string into the DOM
            tbody.innerHTML = rowsHTML;

            ts2 = Date.now();
            console.log("renderTable innerHTML injection: " + (ts2-ts) + " ms");
            ts = ts2;

            applySearch();

            ts2 = Date.now();
            console.log("renderTable search: " + (ts2-ts) + " ms");
            console.log("renderTable total: " + (ts2 - ts0) + " ms");
        }

        function sortTable(colIndex) {
            let ts = Date.now();

            if (currentSort.col === colIndex) {
                currentSort.dir *= -1;
            } else {
                currentSort.col = colIndex;
                currentSort.dir = 1;
            }

            let headers = window.tableData[0];
            let rows = window.tableData.slice(1);

            rows.sort((a, b) => {
                let valA = a[colIndex] !== undefined && a[colIndex] !== null ? a[colIndex].toString().toLowerCase() : '';
                let valB = b[colIndex] !== undefined && b[colIndex] !== null ? b[colIndex].toString().toLowerCase() : '';

                let isDateStr = (s) => {
                    let p = s.split('/');
                    return p.length === 3 && !isNaN(p[0]) && !isNaN(p[1]) && !isNaN(p[2]);
                };
                if (isDateStr(valA) && isDateStr(valB)) {
                    let dA = makeDate(valA).getTime();
                    let dB = makeDate(valB).getTime();
                    return (dA - dB) * currentSort.dir;
                }

                let numA = parseFloat(valA.replace('%', ''));
                let numB = parseFloat(valB.replace('%', ''));
                let isA_num = !isNaN(numA) && !isNaN(valA.replace('%', '').trim()) && valA.trim() !== '';
                let isB_num = !isNaN(numB) && !isNaN(valB.replace('%', '').trim()) && valB.trim() !== '';

                if (isA_num && isB_num) {
                    return (numA - numB) * currentSort.dir;
                }

                if (valA < valB) return -1 * currentSort.dir;
                if (valA > valB) return 1 * currentSort.dir;
                return 0;
            });

            window.tableData = [headers, ...rows];
            console.log("sort0: " + (Date.now()-ts) + " ms");
            renderTableHTML();
            console.log("sort1: " + (Date.now()-ts) + " ms");
        }

        function handleSearchInput() {
            clearTimeout(searchDebounceTimeout);
            searchDebounceTimeout = setTimeout(applySearch, 150);
        }

        function updateRowCountDisplay(visible, total) {
            document.getElementById("rowCountDisplay").textContent = `Showing ${visible} of ${total} rows`;
        }

        function applySearch() {
            let ts0 = Date.now();

            let input = document.getElementById("searchInput").value.toLowerCase();
            let words = input.split(" ").filter(w => w.trim() !== "");
            let isAndLogic = document.getElementById("searchLogicAnd").checked;

            let tbody = document.getElementById("dataTable").getElementsByTagName("tbody")[0];
            let rows = tbody.getElementsByTagName("tr");

            let totalRows = rows.length;
            let visibleRows = 0;

            for (let i = 0; i < rows.length; i++) {
                if (words.length === 0) {
                    rows[i].style.display = "";
                    visibleRows++;
                } else {
                    let rowText = rows[i].dataset.rowtext;
                    let match = isAndLogic ? true : false;
                    let validWordsCount = 0;

                    for (let w of words) {
                        let isNegation = w.startsWith("!");
                        let searchTerm = isNegation ? w.substring(1) : w;

                        if (searchTerm === "") continue;
                        validWordsCount++;

                        let containsTerm = rowText.includes(searchTerm);
                        let conditionMet = isNegation ? !containsTerm : containsTerm;

                        if (isAndLogic) {
                            if (!conditionMet) {
                                match = false;
                                break;
                            }
                        } else {
                            if (conditionMet) {
                                match = true;
                                break;
                            }
                        }
                    }

                    if (validWordsCount === 0) {
                        match = true;
                    }

                    rows[i].style.display = match ? "" : "none";
                    if (match) visibleRows++;
                }
            }

            updateRowCountDisplay(visibleRows, totalRows);
            console.log(
                "applySearch: " +
                (Date.now()-ts0) +
                " ms (" +
                visibleRows +
                "/" +
                totalRows +
                " rows)"
            );
        }

        function tableToCSV(table) {
            return table.map(rowArray => rowArray.join(",")).join("\r\n");
        }

        function buildTable(tdata, headers, sums, transform) {
            console.log("buildTable start"); let ts= Date.now(), ts2,ts0=ts;

            var finalheaders = headers.slice();
            var finaltable = [];
            finaltable.push(finalheaders);
            let arr = splitIntoLines(tdata);

            var indexofid = {};
            var sumlengths = {};

            ts2= Date.now();console.log("buildTable prep : "+(ts2-ts)+" ms");ts=ts2;
            console.log("headers:"+headers);

            for (var r of arr) {
                if (r.length == 0) continue;
                let l = splitLine(r);

                if (!(l[1] in indexofid)) {
                    indexofid[l[1]] = finaltable.length;
                    var newrow = [];
                    var idindex = headers.indexOf("id");
                    if (idindex >= 0) newrow[idindex] = l[1];
                    finaltable.push(newrow);
                }
                l[2]=l[2].trim();
                var argindex = headers.indexOf(l[2]);
                if (argindex >= 0) {
                    if (sums.indexOf(l[2]) >= 0) {
                        if (finaltable[indexofid[l[1]]][argindex] === undefined) finaltable[indexofid[l[1]]][argindex] = [];
                        finaltable[indexofid[l[1]]][argindex].push([l[0], l[3]]);
                    }
                    else {
                        let tags=["contaminated","compost","flies","fungus flies","spent", "storage", "fruit", "sale synallois","stored"]
                        let endval=l[3];
                        if(l[2]=="stored")
                            console.log();
                        if(tags.indexOf(l[2])>-1)
                            endval=l[2];
                        finaltable[indexofid[l[1]]][argindex] = endval;
                     //   console.log(finaltable[indexofid[l[1]]]);
                      //  console.log(finaltable[indexofid[l[1]]][argindex]);
                       // console.log();

                    }
                }
            }

            ts2= Date.now();console.log("buildTable stage 1 : "+(ts2-ts)+" ms");ts=ts2;
        //    console.log("headers:"+headers);
            function displayitem(headers, item){
            /*    console.log("displayitem");
                for(let i=0;i<headers.length;i++){
                    console.log(headers[i]+":"+item[i]);
                }*/
            };
            displayitem(finaltable[0],finaltable[1]);

            for (var r = 1; r < finaltable.length; r++) {   // fill substrate from formula
                for (var f in formulatosubstrate) {
                    var i = finaltable[0].indexOf(f);
                    if (i < 0) continue;
                    let trans = formulatosubstrate[f][finaltable[r][i]];
                    if (trans === undefined) continue;
                    for (let p in trans) {
                        var pi = finaltable[0].indexOf(p);
                        finaltable[r][pi] = trans[p];
                    }
                }
            }

            ts2= Date.now();console.log("buildTable stage 2 : "+(ts2-ts)+" ms");ts=ts2;
          //  console.log("headers:"+headers);
            displayitem(finaltable[0],finaltable[1]);

            for (var r = 1; r < finaltable.length; r++) { // fill
                for (var s of sums) {
                    var i = finaltable[0].indexOf(s);
                    if (i < 0) continue;
                    let tab = finaltable[r][i];
                    if (tab === undefined) continue
                    tab = aggregate(s, tab);
                    finaltable[r][i] = tab;
                    var length = tab.length;
                    if(!sumlengths[s] || sumlengths[s]<length) sumlengths[s] = length;
                }
            }

            ts2= Date.now();console.log("buildTable stage 3 : "+(ts2-ts)+" ms");ts=ts2;
        //    console.log("headers:"+headers);
            displayitem(finaltable[0],finaltable[1]);

            let extraheader = {};
            // Convert sums to total, add count, and expand the trailing columns in-place (pushes tags right)
            for (var s of sums) {
                var i = finaltable[0].indexOf(s);
                if (i >= 0) {
                    // Renames "harvest" to "totalharvest", removing the raw "harvest" column
                    finaltable[0][i] = "total" + s;
                    finaltable = insertColumn(finaltable, i + 1);
                    finaltable[0][i + 1] = s + "count";

                    // Insert trailing summary columns in-place
                    finaltable = insertColumn(finaltable, i + 2);
                    finaltable[0][i + 2] = "last" + s;
                    finaltable = insertColumn(finaltable, i + 3);
                    finaltable[0][i + 3] = "last" + s + "date";

                    if (sumlengths[s] > 0) extraheader[s] = i + 4;

                    let currentPos = i + 4;
                    // Insert dynamic sequential breakdown columns in-place (harvest1, harvest1date, etc.)
                    for (var suml = 1; suml <= sumlengths[s]; suml++) {
                        finaltable = insertColumn(finaltable, currentPos);
                        finaltable[0][currentPos] = s + suml;
                        currentPos++;

                        finaltable = insertColumn(finaltable, currentPos);
                        finaltable[0][currentPos] = s + suml + "date";
                        currentPos++;
                    }
                }
            }

            ts2= Date.now();console.log("buildTable stage 4 : "+(ts2-ts)+" ms");ts=ts2;
         //   console.log("headers:"+headers);
            displayitem(finaltable[0],finaltable[1]);

            // Populate the "totalharvest", "harvestcount", and dynamically inserted cells
            for (var r = 1; r < finaltable.length; r++) {
                for (var s of sums) {
                    var i = finaltable[0].indexOf("total" + s);
                    if (i < 0) continue;
                    let tab = finaltable[r][i], tsum = 0, ind = 0;
                    if (tab === undefined) continue;
                    let lastt;

                    // Fill sequential breakdown columns
                    for (var t of tab) {
                        finaltable[r][extraheader[s] + ind * 2] = t[1];
                        finaltable[r][extraheader[s] + ind * 2 + 1] = t[0];
                        tsum += Number(t[1]);
                        ind++;
                        lastt = t;
                    }

                    finaltable[r][i] = tsum;
                    finaltable[r][i + 1] = tab.length;

                    // Fill 'lastharvest' columns
                    if (lastt) {
                        finaltable[r][extraheader[s] - 2] = lastt[1];
                        finaltable[r][extraheader[s] - 1] = lastt[0];
                    }
                }
            }

            ts2= Date.now();console.log("buildTable stage 5 : "+(ts2-ts)+" ms");ts=ts2;
         //   console.log("headers:"+headers);
            displayitem(finaltable[0],finaltable[1]);

            // Calculate fields logic (Age, BE)
            for (var r = 1; r < finaltable.length; r++) {
                for (var c in calculatedfields) {
                    var target = finaltable[0].indexOf(c);
                    if (target < 0) continue;
                    let op = calculatedfields[c];
                    let optype = Object.keys(op).pop();
                    let args = op[optype];
                    let isdate = false;
                    for (let a of args) if (isDateField(a)) { isdate = true; break; }
                    let argvals = [];
                    function fetchfields(field) {
                        if (field == "now") return formatDate(new Date());
                        let findex = finaltable[0].indexOf(field);
                        return finaltable[r][findex];
                    }
                    let stop = false;
                    for (let a of args) {
                        let fv = fetchfields(a);
                        if (fv === undefined) { stop = true; break; }
                        argvals.push(fv);
                    }
                    if (stop) continue;
                    if (optype == "substract") {
                        if (isdate) finaltable[r][target] = daysDiff(argvals[0], argvals[1]);
                        else finaltable[r][target] = argvals[0] - argvals[1];
                    }
                    if (optype == "divide") finaltable[r][target] = "" + Math.round(100 * argvals[0] / argvals[1]) + "%";
                }
            }
            ts2= Date.now();console.log("buildTable stage 6 : "+(ts2-ts)+" ms");ts=ts2;
        //    console.log("headers:"+headers);
            displayitem(finaltable[0],finaltable[1]);

            console.log("buildTable total : "+(ts2-ts0)+" ms");
            return finaltable;
        }

        function insertColumn(array, index) {
            for (var r in array) array[r].splice(index, 0, undefined);
            return array;
        }

        function formatDate(d) {
            return "" + d.getDate() + "/" + (d.getMonth() + 1) + "/" + (d.getFullYear() - 2000);
        }

        function isDateField(text) {
            if (text.includes("date")) return true;
            if (text == "now") return true;
            return false;
        }

        function makeDate(d) {
            let nd = new Date(0);
            if (d === undefined) {
                console.log();
            }
            let datetab = d.split("/");
            nd.setDate(datetab[0]);
            nd.setMonth(datetab[1] - 1);
            nd.setYear("20" + datetab[2]);
            return nd;
        }

        function daysDiff(d1, d2) {
            let diff = (makeDate(d1).getTime() - makeDate(d2).getTime()) / (1000 * 3600 * 24);
            if (diff < 0) diff = -diff;
            return Math.floor(diff);
        }

        function aggregate(name, odata) {
            let ts0 = Date.now();
            function mindist(date, table) {
                let min;
                for (let t of table) {
                    let diff = daysDiff(t[0], date);
                    if (min === undefined) min = diff;
                    else if (diff < min) min = diff;
                }
                return min;
            }
            function mergedata(tab) {
                let d = 0, v = 0;
                for (let t of tab) {
                    if (d == 0 || makeDate(d).getTime() > makeDate(t[0]).getTime()) d = t[0];
                    v += Number(t[1]);
                }
                let date = d;
                return [date, v];
            }
            if (!(name in aggregated)) return odata;
            if (odata === undefined) {
                console.log();
            }
            var data = odata.slice();
            var period = aggregated[name];
            var toaggregate = [], ndata = [];
            while (data.length > 0) {
                for (var d = 0; d < data.length; d++) {
                    if (toaggregate.length == 0) { toaggregate.push(data[d]); data.splice(d, 1); d--; continue; }
                    var dist = mindist(data[d][0], toaggregate)
                    if (dist <= period) { toaggregate.push(data[d]); data.splice(d, 1); d--; }
                }
                ndata.push(mergedata(toaggregate));
                toaggregate = [];
            }

            console.log("aggregate(" + name + "): " + (Date.now()-ts0) + " ms");
            return ndata;
        }

        function fetchHeaders(col, data) {
            var arr = data.split("\n"), headers = {};
            for (var r of arr) {
                if (r.length == 0) continue;
                var l = r.split(",");
                headers[l[col]] = 1;
            }
            return Object.keys(headers);
        }
