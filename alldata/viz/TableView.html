<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <script src="jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="jquery.dataTables.min.css">
    <script src="jquery.dataTables.min.js"></script>

    <script src="BlockVizDataProcess.js"></script>
    <!-- <script src="BlockVizCommon.js"></script>-->

    <title>Table View</title>

    <style>
        body { font-family: FreeSans, Arimo, 'Droid Sans', Helvetica, Arial, sans-serif; padding: 20px; }
        /* Unified navigation: page title on the left, one identical link per page on the right. */
        .page-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .page-header h1 { margin: 0; font-size: 1.5em; color: #0056b3; }
        .viz-nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .viz-nav a, .viz-nav span.active { padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        /* One cheerful colour per view. The current page wears the full colour, the others a light tint. */
        .viz-nav a.nav-block   { background: #d8f3e3; color: #17794a; }
        .viz-nav a.nav-table   { background: #fdecd1; color: #a4670b; }
        .viz-nav a.nav-graphic { background: #ece0fb; color: #6b2fb0; }
        .viz-nav a.nav-block:hover   { background: #2eb872; color: #fff; }
        .viz-nav a.nav-table:hover   { background: #f2a33c; color: #fff; }
        .viz-nav a.nav-graphic:hover { background: #9b51e0; color: #fff; }
        .viz-nav span.active.nav-block   { background: #2eb872; color: #fff; }
        .viz-nav span.active.nav-table   { background: #f2a33c; color: #fff; }
        .viz-nav span.active.nav-graphic { background: #9b51e0; color: #fff; }
        /* The SuperScale link stays a plain link, with no button background. */
        .viz-nav a.home, .viz-nav a.home:hover { background: none; color: #0056b3; }
        .viz-nav a.home:hover { color: #004494; text-decoration: underline; }

        /* Page-wide viewing controls, above the list of tables. */
        .page-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; font-size: 0.9em; }

        .request-block { margin-bottom: 24px; background: white; border: 1px solid #ddd; padding: 12px 16px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .request-title-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
        /* Name and its detailed request description, left aligned on one line. */
        .request-title-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .request-title-bar h2 { margin: 0; color: #0056b3; }
        .request-title-bar a.edit-btn { background: #0056b3; color: white; padding: 6px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .request-title-bar a.edit-btn:hover { background: #004494; }

        .req-info { font-size: 0.85em; color: #555; margin: 0; background: #f9f9f9; padding: 4px 10px; border-radius: 4px; }

        /* Requests from this browser and from the scale share the same panel, but a background tint
           and a small badge tell them apart at a glance. */
        .request-block.is-local { background: #eef4fb; border-color: #cadcef; }
        .request-block.is-server { background: #fdf6e6; border-color: #ecdcb0; }
        .src-badge { font-size: 0.7em; font-weight: bold; text-transform: uppercase; letter-spacing: .5px; padding: 2px 8px; border-radius: 10px; }
        .src-badge.local { background: #cfe0f0; color: #23527c; }
        .src-badge.server { background: #f0e0b0; color: #7a5c00; }

        /* Reordering: one up / one down button per panel. */
        .move-group { display: inline-flex; gap: 2px; }
        .move-btn { padding: 2px 7px; background: #e0e0e0; color: #555; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; line-height: 1; }
        .move-btn:hover:not(:disabled) { background: #d0d0d0; }
        .move-btn:disabled { opacity: .35; cursor: default; }

        /* Entries per page: a plain input with a datalist of presets, kept where DataTables renders it. */
        .dataTables_length input.page-length-input { width: 5em; padding: 3px 6px; border: 1px solid #bbb; border-radius: 4px; font-size: 1em; }

        /* DataTables floats the info text, the entries-per-page control and the pager on one line,
           which leaves them on different baselines. Lay that row out as a flex row instead so the
           info sits on the left, the pager on the right, and everything is vertically centred. */
        .dataTables_wrapper .top { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
        .dataTables_wrapper .top .dataTables_info,
        .dataTables_wrapper .top .dataTables_length { float: none; padding: 0; margin: 0; }
        .dataTables_wrapper .top .dataTables_paginate { float: none; margin: 0 0 0 auto; padding: 0; }
        .dataTables_wrapper .top .page-length-input { vertical-align: middle; }

        /* Dense Table Styles */
        table.dataTable { font-size: 0.85em; width: 100%; border-collapse: collapse; }
        table.dataTable th, table.dataTable td { padding: 3px 6px; white-space: nowrap; box-sizing: border-box; border: 1px solid #ddd; text-align: left; }
        table.dataTable th { background-color: #f4f4f4; position: sticky; top: 0; z-index: 2; padding-top: 6px; padding-bottom: 6px; }
        table.dataTable th:hover { background-color: #e0e0e0; }
        /* Alternating rows: only a hint of a shade on every second row. The tint is a background
           image rather than a background colour, so it also shows up on rows whose cells already
           carry a per-species colour. */
        table.dataTable tbody tr:nth-child(even) > td {
            background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1));
        }
        td.boldColumn { font-weight: bold; }

        /* Header display modes, matching Block Explore (see the page "Headers" control):
           - original: the raw stored key, exactly as is on one line, no wrapping.
           - spaced:   the readable words, stacked vertically as upright letters (no rotation).
           - rotated:  the same words, turned -90deg so they read bottom to top. */
        table.dataTable.headers-original th { white-space: nowrap; overflow-wrap: normal; }
        /* The vertical writing mode sits on an inner inline-block wrapper rather than on the cell:
           a cell laid out in a vertical writing mode does not grow to fit its content and would
           spill out over the table. */
        table.dataTable th .hdr-stacked {
            display: inline-block;
            writing-mode: vertical-rl;
            text-orientation: upright;
            white-space: nowrap;
            line-height: 1.15;
        }
        /* Start the stacked header at the top of the cell instead of centring it in the tall row. */
        table.dataTable.headers-spaced th { vertical-align: top; }
        table.dataTable.headers-rotated th {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
            overflow-wrap: normal;
            height: 130px;
        }

        /* The pinned totals row sticks just below the header, whose height changes with the header
           display mode, so its offset is driven by --header-h (set per table from JS). */
        table.dataTable tfoot th { position: sticky; top: var(--header-h, 35px); background: #fff8d5; font-weight: bold; z-index: 3; border-top: 2px solid #999; }

        /* --- TOOLTIP STYLING ADDED HERE --- */
        #blockInfoBubble {
            display: none; position: absolute; background: white; border: 1px solid #888;
            padding: 12px; max-width: 600px; max-height: 400px; overflow: auto;
            box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 10000;
            font-family: monospace; font-size: 1.1em; white-space: pre; color: #000; line-height: 1.3;
        }

        .delete-btn { background:#c62828; color:white; border:none; border-radius:4px; padding:6px 15px; cursor:pointer; font-weight:bold; }
        .delete-btn:hover { background:#a61f1f; }

        /* --- HIDEABLE COLUMNS --- */
        .col-chooser { position: relative; display: inline-block; font-size: 0.9em; font-weight: normal; }
        .col-chooser > summary {
            cursor: pointer; list-style: none; user-select: none;
            padding: 3px 8px; background: #e8e8e8;
            border: 1px solid #bbb; border-radius: 4px;
        }
        .col-chooser > summary::-webkit-details-marker { display: none; }
        .col-chooser > summary:hover { background: #dcdcdc; }
        .col-chooser[open] > summary { background: #d5e5f5; border-color: #0056b3; }
        .col-chooser-panel {
            position: absolute; z-index: 50; top: 100%; left: 0; margin-top: 4px;
            background: #fff; border: 1px solid #888; border-radius: 4px;
            box-shadow: 0 4px 12px rgba(0,0,0,.25); padding: 6px 10px;
            max-height: 320px; overflow: auto; text-align: left;
        }
        .col-chooser-panel .col-chooser-list { column-width: 140px; }
        .col-chooser-panel label { display: block; white-space: nowrap; padding: 1px 0; font-weight: normal; cursor: pointer; }
        .col-chooser-panel .col-chooser-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        .col-chooser-panel .col-chooser-actions button {
            padding: 1px 6px; background: #e0e0e0; color: #555;
            border: 1px solid #ccc; border-radius: 3px; cursor: pointer;
            font-size: 0.8em; white-space: nowrap;
        }
        .col-chooser-panel .col-chooser-actions button:hover { background: #d0d0d0; }
        .col-chooser-panel .col-chooser-actions .col-toggle-empty,
        .col-chooser-panel .col-chooser-actions .col-toggle-harvest,
        .col-chooser-panel .col-chooser-actions .col-toggle-tags {
            padding: 0 4px; font-size: 0.7em;
        }
        /* Pressed = that group of columns is currently hidden. */
        .col-chooser-panel .col-chooser-actions button.pressed,
        .col-chooser-panel .col-chooser-actions button.pressed:hover {
            background: #b6d2ee; border-color: #0056b3; color: #003b73;
            box-shadow: inset 0 2px 4px rgba(0,0,0,.35);
        }
    </style>

    <script>
        let parsedTableData = [];
        let tableFiltersMap = {};
        let blockInfoIndex = {}; // Ensure global scope for raw text mapping
        let allSavedRequests = []; // Browser + scale requests, in the shown order
        let dtHeadersDef = null; // Column definitions, kept so the panels can be re-rendered on move
        let tableViewHeaderMode = "spaced"; // Page-wide header display mode (see the "Headers" control)

        $(document).ready(function() {
            // Header display mode is a page-wide viewing preference, remembered in this browser.
            let savedHeaderMode = localStorage.getItem('tableViewHeaderMode');
            if (savedHeaderMode) { tableViewHeaderMode = savedHeaderMode; $('#headerMode').val(savedHeaderMode); }
            $('#headerMode').on('change', function () {
                tableViewHeaderMode = this.value;
                localStorage.setItem('tableViewHeaderMode', tableViewHeaderMode);
                applyHeaderModeToAll();
            });

            // Browser and scale requests are shown as one list: the private ones first, then the
            // shared ones. The arrows on each panel change the order.
            loadAllSavedRequests(function (savedRequests) {
            allSavedRequests = savedRequests;

            if (allSavedRequests.length === 0) {
                $('#requestsContainer').html('<p>No requests saved yet.</p>');
                return;
            }

            var xhttp = new XMLHttpRequest();
            xhttp.addEventListener("load", function () {
                if (this.status == 200) {

                    let tdata2 = removeCancels(this.response);
                    let tdata3 = removeConsecutiveDuplicates(tdata2);

                    // FIXED: Generate the raw text logs to power the Tooltip!
                    if (typeof buildBlockInfoIndex === 'function') {
                        buildBlockInfoIndex(tdata3);
                    }

                    var headers = fetchHeaders(2, tdata3);
                    var orderedheaders = preorder.slice();
                    orderedheaders = [...new Set([...orderedheaders, ...headers])];

                    parsedTableData = buildTable(tdata3, orderedheaders, sums);

                    dtHeadersDef = parsedTableData[0].map((h, colIndex) => ({
                        title: h, defaultContent: "",
                        className: (h === "id" || h === "blockdate" || h === "totalharvest") ? "boldColumn" : "",
                        render: function (data, type, row) {
                            if (data == null) return "";
                            if (h === "BE") {
                                let num = parseFloat(String(data).replace("%",""));
                                if (type === "sort" || type === "type") return num;
                                return data;
                            }
                            // Date cells (blockdate, *date columns and the tag columns, which store the tag date)
                            // are sorted chronologically using the shared D/M/YY parser.
                            let dateTs = makeDate(data).getTime();
                            if (Number.isFinite(dateTs)) {
                                if (type === "sort" || type === "type") return dateTs;
                                return data;
                            }
                            if (h === "Age" || h === "spawn" || h === "totalsubstrate" || h === "totalharvest" || h === "harvestcount" || /^harvest\d+$/.test(h)) {
                                let n = Number(data);
                                if (!isNaN(n) && (type === "sort" || type === "type")) return n;
                            }
                            return data;
                        }
                    }));

                    renderTablesUI(allSavedRequests, dtHeadersDef);
                }
            });
            xhttp.open("GET", "../data.txt");
            xhttp.send();
            });

            // Move a panel up or down and redraw the list in its new order.
            $(document).on("click", ".move-btn", function () {
                if (moveSavedRequest(allSavedRequests, $(this).data("key"), Number($(this).data("dir")))) {
                    renderTablesUI(allSavedRequests, dtHeadersDef);
                }
            });

            // Delete a panel, from this browser or from the scale, then redraw the remaining list.
            $(document).on("click", ".delete-btn", function () {
                let key = $(this).data("key");
                let req = allSavedRequests.find(r => requestKey(r) === key);
                if (!req) return;
                if (!confirm(`Delete request "${req.name}" ${req.__server ? "from the scale" : "from this browser"} ?`)) return;

                if (req.__server) {
                    deleteSavedRequest(req, function (text, xhttp) {
                        if (!xhttp || xhttp.status !== 200) { alert("Could not delete on the scale.\n" + (text || "")); return; }
                        removePanel(req, key);
                    });
                } else {
                    deleteSavedRequest(req);
                    removePanel(req, key);
                }
            });

            function removePanel(req, key) {
                allSavedRequests = allSavedRequests.filter(r => requestKey(r) !== key);
                if (allSavedRequests.length === 0) {
                    $('#requestsContainer').html('<p>No requests saved yet.</p>');
                    return;
                }
                renderTablesUI(allSavedRequests, dtHeadersDef);
            }

            // UPDATED TOOLTIP ROW CLICK LISTENER
            $(document).on('click', 'table.dataTable tbody tr', function(e) {
                let tableId = $(this).closest('table').attr('id');
                let tableApi = $('#' + tableId).DataTable();
                let row = tableApi.row(this).data();
                if(!row) return;

                let headers = parsedTableData[0];
                let idxId = headers.indexOf("id");
                let idxBE = headers.indexOf("BE");
                let idxTotalH = headers.indexOf("totalharvest");
                let idxHarvCount = headers.indexOf("harvestcount");

                let id = row[idxId];
                let be = row[idxBE] ? row[idxBE] : "N/A";
                let totalH = row[idxTotalH] ? row[idxTotalH] + "g" : "0g";
                let hCount = row[idxHarvCount] || 0;

                let info = blockInfoIndex[id];
                let rawLog = info ? info.join("\n") : "No raw data available.";
                let tooltipContent = `harvest: ${totalH}, count: ${hCount}, be: ${be}\n--------------------------\n${rawLog}`;

                $("#blockInfoBubble").text(tooltipContent).css({ left: e.pageX + 10, top: e.pageY + 10 }).show();
            });

            // HIDE TOOLTIP ON CLICK OUTSIDE
            $(document).on('click', function(e) {
                if(!$(e.target).closest("table.dataTable").length && !$(e.target).closest("#blockInfoBubble").length) {
                    $("#blockInfoBubble").hide();
                }
            });
        });

        // DataTables Search Algorithm
        $.fn.dataTable.ext.search.push(function (settings, searchData, index, rowData, counter) {
            let req;
            if (typeof tableFiltersMap !== 'undefined' && tableFiltersMap[settings.nTable.id]) {
                req = tableFiltersMap[settings.nTable.id];
            } else {
                return true;
            }
            if (!req) return true;

            return applyRowFilter(rowData, parsedTableData[0], req);
        });
        function removeCancels(td) {
            let ts0 = Date.now();
            let tde = splitIntoLines(td);
            let toremove = new Set();

            for (let r = 0; r < tde.length; r++) {
                if (tde[r].length == 0) continue;
                let sub = splitLine(tde[r]);

                if (sub[2] == "cancel") {
                    for (let k = r - 1; k >= 0; k--) {
                        if (toremove.has(k)) continue;

                        let ksub = tde[k].split(",");
                        if (ksub[1] == sub[1] && (ksub[2] == sub[3] || (sub[3] == "" && ksub[2] != "cancel"))) {
                            toremove.add(k);
                            toremove.add(r);
                            break;
                        }
                    }
                }
            }

            if (toremove.size > 0) {
                let out = [];
                for (let i = 0; i < tde.length; i++) {
                    if (!toremove.has(i)) out.push(tde[i]);
                }
                return out.join("\n");
            }
            let ret=tde.join("\n");
            //     console.log("remove cancels " + (Date.now()-ts0) + " ms");
            return ret;
        }

        function removeConsecutiveDuplicates(td) {
            let lines = td.split('\n');
            let out = [];
            for (let i = 0; i < lines.length; i++) {
                if (i === 0 || lines[i] !== lines[i - 1]) {
                    out.push(lines[i]);
                }
            }
            return out.join('\n');
        }
        // One up / one down button per panel; disabled at the ends of the list.
        function moveButtonsHtml(key, index, count) {
            return `<div class="move-group">
                        <button class="move-btn" data-key="${key}" data-dir="-1" title="Move up" ${index === 0 ? "disabled" : ""}>&#9650;</button>
                        <button class="move-btn" data-key="${key}" data-dir="1" title="Move down" ${index === count - 1 ? "disabled" : ""}>&#9660;</button>
                    </div>`;
        }

        // The stock "entries per page" control is a <select>. Swap it in place for a text input
        // backed by a <datalist> of the usual presets, so a value can be picked from the list or
        // typed directly. Changing it goes through api.page.len(), which fires "length.dt" and so
        // reuses the per-request persistence handler.
        function buildPageLengthInput($table, tableId, api) {
            let $select = $table.closest('.dataTables_wrapper').find('div.dataTables_length select').first();
            if (!$select.length) return;

            let listId = tableId + '_lenList';
            let $datalist = $('<datalist>').attr('id', listId);
            [10, 25, 50, 100].forEach(function (n) { $datalist.append($('<option>').attr('value', n)); });

            let $input = $('<input type="number" min="1" step="1" class="page-length-input">')
                .attr('list', listId)
                .val(api.page.len());

            $select.replaceWith($input);
            $input.after($datalist);

            $input.on('change', function () {
                let n = parseInt($input.val(), 10);
                if (!n || n < 1) { $input.val(api.page.len()); return; }
                api.page.len(n).draw(false);
            });
        }

        // Apply the page-wide header display mode to every table already on the page.
        function applyHeaderModeToAll() {
            $('#requestsContainer table').each(function () {
                let $t = $(this);
                setHeaderMode($t, parsedTableData[0], tableViewHeaderMode);
                syncHeaderHeight($t);
                if ($.fn.DataTable.isDataTable(this)) $t.DataTable().columns.adjust();
            });
        }

        function renderTablesUI(savedRequests, dtHeaders) {
            // Redrawing the panels replaces them, so dispose the DataTables that are going away.
            $('#requestsContainer table').each(function () {
                if ($.fn.DataTable.isDataTable(this)) $(this).DataTable().destroy();
            });

            let dtData = parsedTableData.slice(1);
            let emptyColumns = findEmptyColumns(parsedTableData[0], dtData);
            let container = $('#requestsContainer');
            container.empty();
            let footerHtml = parsedTableData[0].map(() => "<th></th>").join("");

            savedRequests.forEach((req, idx) => {
                let tableId = "dt_" + idx;
                tableFiltersMap[tableId] = req;
                let hiddenColumns = req.hiddenColumns = req.hiddenColumns || [];
                let isServer = !!req.__server;
                let source = isServer ? "server" : "local";
                let key = requestKey(req);

                // Delete works on both kinds. The columns chooser works on both too, since a hidden
                // column is a viewing choice that can be saved back to either store. Only the
                // re-edit link stays for this browser's own requests, as a scale request is
                // otherwise edited from Block Explore.
                let controls = `
                                <details class="col-chooser">
                                    <summary>Columns &#9662;</summary>
                                    <div class="col-chooser-panel" id="colChooserPanel_${idx}"></div>
                                </details>
                                <button class="delete-btn" data-key="${key}">Delete</button>`;
                if (!isServer) controls += `
                                <a href="BlockViz.html?loadReq=${encodeURIComponent(req.name)}" class="edit-btn">Re-Edit Request →</a>`;

                let html = `
                    <div class="request-block is-${source}">
                        <div class="request-title-bar">
                            <div class="request-title-group">
                                <h2>${req.name}</h2>
                                <span class="src-badge ${source}">${isServer ? "Scale" : "Browser"}</span>
                                <div class="req-info">${describeRequest(req)}</div>
                            </div>
                            <div style="display:flex; gap:8px; align-items:center;">
                                ${moveButtonsHtml(key, idx, savedRequests.length)}
                                ${controls}
                            </div>
                        </div>
                        <table id="${tableId}" class="display" style="width:100%">
                            <tfoot><tr>${footerHtml}</tr></tfoot>
                        </table>
                    </div>
                `;
                container.append(html);

                $('#' + tableId).DataTable({
                    data: dtData,
                    columns: dtHeaders,
                    footer: true,
                    deferRender: true,
                    pageLength: req.pageLength || 10,
                    // Pager is kept above the table only, so no "bottom" paginate block.
                    dom: '<"top"ilp>rt<"clear">',
                    order: [],
                    scrollX: false,
                    footerCallback: function () {
                        if (typeof updateAverageRow === 'function') {
                            updateAverageRow(this.api(), tableId, parsedTableData[0]);
                        }
                    },
                    drawCallback: function () {
                        if (typeof updateAverageRow === 'function') {
                            updateAverageRow(this.api(), tableId, parsedTableData[0]);
                        }
                        // Keep the pinned totals row right below the header, whose height depends on
                        // the header display mode and on how many lines it wraps onto.
                        let t = $('#' + tableId);
                        if (t.length) syncHeaderHeight(t);
                    },
                    createdRow: function(row, data, dataIndex) {
                        let speciesIndex = parsedTableData[0].indexOf("species");
                        if (typeof getSpeciesColor === 'function') {
                            let color = getSpeciesColor(data[speciesIndex]);
                            if(color) $(row).find("td").css("background-color", color);
                        }
                    }
                });

                let $table = $('#' + tableId);

                // Remember the "entries per page" choice per request: a browser request keeps it in
                // this browser, a scale request is written back to the shared file.
                let pageLength = req.pageLength || 10;
                $table.on("length.dt", function (e, settings, len) {
                    if (len === pageLength) return;
                    pageLength = len;
                    req.pageLength = len;
                    patchSavedRequest(req, { pageLength: len }, function (text, xhttp) {
                        if (req.__server && (!xhttp || xhttp.status !== 200)) {
                            alert("Could not save the page size on the scale.\n" + (text || ""));
                        }
                    });
                });

                // Replace the stock drop-down with an input + datalist, in the same spot.
                buildPageLengthInput($table, tableId, $table.DataTable());

                // Both kinds honour the columns they were saved with, and both can be changed from
                // here: a browser request keeps the choice in this browser, a scale request is
                // written back to the shared file on the scale.
                applyColumnVisibility(parsedTableData[0], hiddenColumns, $table);
                buildColumnChooser($("#colChooserPanel_" + idx), parsedTableData[0], hiddenColumns, function () {
                    applyColumnVisibility(parsedTableData[0], hiddenColumns, $table);
                    patchSavedRequest(req, { hiddenColumns: hiddenColumns.slice() }, function (text, xhttp) {
                        if (req.__server && (!xhttp || xhttp.status !== 200)) {
                            alert("Could not save the hidden columns on the scale.\n" + (text || ""));
                        }
                    });
                }, emptyColumns);

                // Header display mode is page-wide, so every table gets the same one. Applied last,
                // after the column visibility, so nothing redraws the headers over it.
                setHeaderMode($table, parsedTableData[0], tableViewHeaderMode);
                syncHeaderHeight($table);

                setTimeout(() => {
                    if ($.fn.DataTable.isDataTable('#' + tableId)) {
                        $('#' + tableId).DataTable().columns.adjust();
                    }
                }, 50);
            });
        }
    </script>
</head>
