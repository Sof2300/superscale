    var geid = document.getElementById.bind(document);

    function loadRemote(addr, f, err) {
  //      console.log("---> loadRemote: loading url : "+addr);
        var xhttp = new XMLHttpRequest();
        xhttp.addEventListener("load", function () {
//            console.log("<--- loadRemote: loaded url : "+addr);
            if (this.status != 200) err.bind(this)(); else f.bind(this)();
        });
        if (err) xhttp.addEventListener("error", err);
        xhttp.open("GET", addr);
        xhttp.setRequestHeader('x-Date', Math.floor((new Date().getTime()) / 1000));
        xhttp.send();
    }

    function setDisabledIds(ids, newstate) {
        // console.log("setDisabledIds "+newstate+" "+ids);
        for (var k in ids) {
            var el = geid(ids[k]);
            if (el) {
                // iOS FIX: If we disable the focused input, iOS immediately hides the keyboard.
                // We identify the 'id' input and use readOnly instead of disabled.
                if (ids[k].indexOf("_input_id") !== -1) {
                    el.readOnly = newstate;
                    el.style.opacity = newstate ? "0.6" : "1"; // Keep visual feedback
                } else {
                    el.disabled = newstate;
                }
            }
        }
    }

    function focusIdField() {
        // Make sure the UI has been built
        if (typeof currentcommandUI !== 'undefined' && currentcommandUI && currentcommandUI.commandlineui) {
            // Fetch the component representing the 'id' field
            var idComp = currentcommandUI.commandlineui.row.valuecomps["id"];
            if (idComp && idComp.id) {
                // Use setTimeout to ensure the DOM is painted and elements are unlocked
                //      setTimeout(function() {
                var idEl = geid(idComp.id);
                if (idEl && !idEl.disabled) {
                    idEl.focus();
                    // Move the cursor to the end of the text if there's already a value
                    if (typeof idEl.setSelectionRange === "function" && idEl.value) {
                        idEl.setSelectionRange(idEl.value.length, idEl.value.length);
                    }
                }
                //   }, 50);
            }
        }
    }

    function disenableload(url, idarray, reload = true, custf, custerr) {
        userActionPending = true;

        focusIdField();

        setDisabledIds(idarray, true);

        function f() {
            if(custf!==undefined) custf.bind(this)();
            if (reload) setTimeout(function () {
                enableloadjson(idarray)
            }, 200);
        }

        function fe() {
            if(custerr!==undefined) custerr.bind(this)();
            if (reload) setTimeout(function () {
                enableloadjson(idarray)
            }, 200);
        }

        loadRemote(url, f, fe);
    }

            });    //stay disabled
        loading = true;

    function dataloaded() {
        var jsonstring = this.responseText;
        while (jsonstring[jsonstring.length - 1] == '\n') jsonstring = jsonstring.substr(0, jsonstring.length - 1);
        jsonstring = jsonstring.replace(/\r/g, "");
        var arr = jsonstring.split("\n");
        arr.reverse();
        var nstring = arr.join("\n");
        geid("tarea").textContent = nstring;
        pageUI.updateDataFile(jsonstring);
    }

    var loadingData = false;

    function loadDataFile() {
        if (loadingData) return; // don't reload if previous load did not finish
        var timing = new Date().getTime(); 
        geid("tarea").disabled = true;
        loadRemote('data.txt', function () {
                loadingData = false;
                geid("tarea").disabled = false;
                console.log('data load delay:' + (new Date().getTime() - timing) / 1000);
                dataloaded.bind(this)();
            }
            , function () {
                loadingData = false;
                geid("content").disabled = true;
            });    //stay disabled
        loadingData = true;
    }

    var currentversion = -1, loadingversion;

    function updateDataFile(data) {
        if (loadingversion == data["configstate"]["data-version"]) currentversion = loadingversion;
        if (currentversion != data["configstate"]["data-version"]) {
            loadingversion = data["configstate"]["data-version"];
            loadDataFile();
        }
    }

    function reqListener() {
        var jsonstring = this.responseText;
        var t = jsonstring.replace(/\r/g, "");
        t = t.replace(/\n/g, "\\n");
        var tobj = JSON.parse(t);

        var isFirstLoad = !init;

        if (!init) {
            showPage(tobj);
            init = true;
        } else updatePage(tobj);
        dataobj = tobj;
        updateDataFile(tobj);
        // Update message toggle component if present
        updateMessageToggle(tobj);
        // Ensure click handler attached once
        attachMessageToggleHandler();
        // Handle focusing
        if (isFirstLoad || userActionPending) {
            focusIdField();
            userActionPending = false; // Reset the flag
        }
    }

    function loadjson() {
        if (loading) return; // don't reload if previous load did not finish
        var timing = new Date().getTime();
        loadRemote('/json', function () {
                loading = false;
                geid("content").disabled = false;
                console.log('json load delayz:' + (new Date().getTime() - timing) / 1000);
                reqListener.bind(this)();
            }
            , function () {
                loading = false;
                geid("content").disabled = true;
            });    //stay disabled
        loading = true;
    }

    var loading = false;
    var init = false, dataobj = {};
    var appConfig = null; // Store the config globally
    function startScript() {
        if (DEBUGOFFLINE) {
            appConfig = {
                "mode": "ST",
                "lastvalnames": ["species", "blockdate", "formula"],
                "sumnames": ["harvest", "substrate"],
                "multivalnames": ["spawn"],
                "defaultcommand": "harvest",
                "tags": ["fruit", "sale", "flies", "spent", "contaminated", "compost", "storage", "glifada"]
            };
            updateDataFile(JSON.parse(jsonsampledata));
            showPage();
            focusIdField();
            return;
        }
        loading = false;

        function initApp() {
            loadjson();
            var duration = 1000;
            setInterval(loadjson, duration);
        }

        // Load config.json first
        loadRemote('config.json', function () {
            try {
                let text = this.responseText
                while (text.indexOf("//") >= 0) { //remove comments like this one, not allowed in json
                    let start = text.indexOf("//");
                    let end = text.indexOf("\n", start);
                    if (end < -1) end = text.length;
                    text = text.substring(0, start) + text.substring(end, text.length);
                }
                appConfig = JSON.parse(text);
            } catch (e) {
                console.error("Config parse error", e);
            }
            initApp();
        }, function () {
            console.error("Config load error");
            initApp(); // Fallback to starting anyway if it fails
        });
    }

    // Message toggle state and updater (Refactored to be a simple, continuous queue queueing playback)
    var messageToggleState = 'currentmessage';
    var messageToggleFirstLoad = true;
    var messageQueue = [];
    var messagePlayTimeout = null;
    // Newest history line we already processed. The device caps allmessages
    // (ALLMESSAGES_LIMIT), so the line count stops growing once the cap is hit;
    // tracking the newest line keeps detecting messages in that case.
    var lastAllMessagesLine = null;
    // When true the "all messages" view is rendered newest-first. Off by default
    // (chronological order); how this gets toggled is still to be decided.
    var messageReverseOrder = false;

    function pad2(v) {
        return String(v).padStart(2, '0');
    }

    function parseBootTimeString(value) {
        if (!value || typeof value !== 'string') return null;
        var match = value.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(\d{1,2}):(\d{2}):(\d{2})$/);
        if (!match) return null;
        var day = parseInt(match[1], 10);
        var month = parseInt(match[2], 10);
        var year = parseInt(match[3], 10);
        var hour = parseInt(match[4], 10);
        var minute = parseInt(match[5], 10);
        var second = parseInt(match[6], 10);
        if (year < 100) year += 2000;
        // Create Date using UTC since superscale provides GMT timestamps
        var date = new Date(Date.UTC(year, month - 1, day, hour, minute, second));
        if (isNaN(date.getTime())) return null;
        return date;
    }

    function formatBootRelativeMessageTime(rawSeconds, bootTimeString) {
        if (rawSeconds === null || rawSeconds === undefined || rawSeconds === '') return rawSeconds;
        var seconds = Number(rawSeconds);
        if (!isFinite(seconds)) return rawSeconds;
        var bootDate = parseBootTimeString(bootTimeString);
        if (!bootDate) return rawSeconds;
        var messageDate = new Date(bootDate.getTime() + (seconds * 1000));
        return pad2(messageDate.getDate()) + '/' + pad2(messageDate.getMonth() + 1) + '/' + String(messageDate.getFullYear()).slice(-2) +
            ' ' + pad2(messageDate.getHours()) + ':' + pad2(messageDate.getMinutes()) + ':' + pad2(messageDate.getSeconds());
    }

    function parseMessageLine(line) {
        var parts = String(line).split('|');
        if (parts.length < 3) return null;
        var durationSeconds = parseFloat(parts[parts.length - 1].trim());
        return {
            time: parts[0].trim(),
            text: parts.slice(1, -1).join(' | ').trim(),
            durationText: parts[parts.length - 1].trim(),
            durationSeconds: isFinite(durationSeconds) ? durationSeconds : 0
        };
    }

    function getCurrentMessageDetails(lines, currentMessage) {
        for (var i = lines.length - 1; i >= 0; i--) {
            var details = parseMessageLine(lines[i]);
            if (details && details.text === currentMessage) return details;
        }
        return null;
    }

    // The message that should stay displayed once playback of the temporary
    // messages has ended: the last permanent message in the history
    // (duration 0). Temporary messages (duration > 0) are only shown while playing.
    function getLastPermanentMessageDetails(lines) {
        if (!lines) return null;
        for (var i = lines.length - 1; i >= 0; i--) {
            var details = parseMessageLine(lines[i]);
            if (details && details.durationSeconds === 0) return details;
        }
        return null;
    }

    // True when the view is already pinned to the "newest" end of the list
    // (top when reversed, bottom otherwise). Used to decide whether an update
    // should keep following the newest message or respect the user's scrollback.
    function isMessageToggleAtEnd(el) {
        if (!el) return true;
        var tolerance = 8;
        if (messageReverseOrder) return el.scrollTop <= tolerance;
        return (el.scrollHeight - el.clientHeight - el.scrollTop) <= tolerance;
    }

    function formatAllMessages(raw, bootTimeString) {
        if (!raw || !raw.length) return raw || '';
        var lines = String(raw).split('\n');
        var formatted = [];
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            var details = parseMessageLine(line);
            if (details) {
                var formattedTime = formatBootRelativeMessageTime(details.time, bootTimeString);
                var durationSuffix = details.durationSeconds > 0 ? ' (' + details.durationText + 's)' : '';
                formatted.push('<p>' + formattedTime + ' : ' + details.text + durationSuffix + '</p>');
            } else {
                formatted.push('<p>' + line + '</p>');
            }
        }
        if (messageReverseOrder) formatted.reverse();
        return formatted.join('');
    }
	var cacheddata={}
    function updateMessageToggle(tobj, force) {
        try {
            var payload = tobj && tobj.configstate ? tobj.configstate : (tobj || {});
            var cur = payload.currentmessage || "";
            var all = payload.allmessages || "";
            var bootTime = (tobj && tobj.config && tobj.config.boottime) || "";
            var el = geid('messageToggle');
            if (!el) return;
            var clearMessagesButton = geid('clearMessagesButton');
            if (clearMessagesButton) clearMessagesButton.style.display = all.trim().length ? '' : 'none';
			
			if(!force && cacheddata.cur==cur && cacheddata.all==all && cacheddata.state==messageToggleState && cacheddata.reverse==messageReverseOrder) return; // nothing to update
			cacheddata.cur=cur;
			cacheddata.all=all;
			cacheddata.state=messageToggleState;
			cacheddata.reverse=messageReverseOrder;

            if (messageToggleState === 'currentmessage') {
                var lines = [];
                if (all) lines = all.trim().split('\n');

                var currentDetails = getCurrentMessageDetails(lines, cur);
                var newestLine = lines.length ? lines[lines.length - 1] : null;

                // First load: ignore parsing full history, just sync the marker and showcase what's currently active.
                if (lastAllMessagesLine === null && newestLine !== null) {
                    lastAllMessagesLine = newestLine;
                    if (cur) messageQueue.push({
                        text: cur,
                        time: currentDetails ? currentDetails.time : '',
                        durationSeconds: currentDetails ? currentDetails.durationSeconds : 0,
                        duration: 2000
                    });
                }
                // History cleared or explicitly reset
                else if (newestLine === null) {
                    lastAllMessagesLine = null;
                    messageQueue = [];
                    if (messagePlayTimeout) {
                        clearTimeout(messagePlayTimeout);
                        messagePlayTimeout = null;
                    }
                }
                // New messages appended: queue every line after the last one we saw.
                // (Comparing the newest line instead of the count also works once the
                // device's allmessages cap is reached and the count stops growing.)
                else if (newestLine !== lastAllMessagesLine) {
                    var lastSeenIndex = lines.indexOf(lastAllMessagesLine);
                    var firstNew = lastSeenIndex === -1 ? lines.length : lastSeenIndex + 1;
                    for (var i = firstNew; i < lines.length; i++) {
                        var details = parseMessageLine(lines[i]);
                        if (details) {
                            messageQueue.push({
                                text: details.text,
                                time: details.time,
                                durationSeconds: details.durationSeconds,
                                duration: details.durationSeconds * 1000 || 2000
                            });
                        }
                    }
                    lastAllMessagesLine = newestLine;
                }

                // Kickstart sequence queue playing if its currently idle
                if (!messagePlayTimeout && messageQueue.length > 0) {
                    playNextMessage();
                }

                // Normal un-queued status display  
                if (messageQueue.length === 0 && !messagePlayTimeout) {
                    // Rest on the last permanent message (duration 0), not on the last
                    // played message which may be temporary. Fall back to the server's
                    // current message if no permanent message is present in the history.
                    var restDetails = getLastPermanentMessageDetails(lines) || currentDetails;
                    var restText = restDetails ? restDetails.text : cur;
                    var currentTime = restDetails ? formatBootRelativeMessageTime(restDetails.time, bootTime) : '';
                    el.innerText = restText ? (currentTime ? currentTime + ' : ' + restText : restText) : '-';
                    el.style.backgroundColor = '';
                }

                el.title = 'Click to show all messages';
                el.style.whiteSpace = 'normal'; 
                el.className = 'message-current';
            } else {
                // Decide before swapping the content whether to keep following the
                // newest message; skip if the user has scrolled back.
                var wasAtEnd = messageToggleFirstLoad || isMessageToggleAtEnd(el);
                el.innerHTML = all && all.length ? formatAllMessages(all, bootTime) : '-';
                el.title = 'Click to show current message';
                el.style.whiteSpace = 'normal';
                el.style.backgroundColor = '';
                el.className = 'message-all';
                if (wasAtEnd) {
                    // Newest message lives at the top when reversed, at the bottom otherwise.
                    el.scrollTop = messageReverseOrder ? 0 : el.scrollHeight;
                }
                messageToggleFirstLoad = false;
            }
        } catch (e) {
            console.error(e)
        }
    }

    function playNextMessage() {
        if (messageToggleState !== 'currentmessage' || messageQueue.length === 0) {
            messagePlayTimeout = null; // Correctly nulls pointer, unlocking display
            var el = geid('messageToggle');
            if (el) {
                el.style.backgroundColor = '';
                // When queue finishes, force a refresh so the panel stops on the
                // last permanent message (bypass the cache; data itself is unchanged).
                updateMessageToggle(dataobj, true);
            }
            return;
        }

        var msg = messageQueue.shift();
        var el = geid('messageToggle');
        if (el) {
            var bootTime = (dataobj && dataobj.config && dataobj.config.boottime) || '';
            var formattedTime = msg.time ? formatBootRelativeMessageTime(msg.time, bootTime) : '';
            el.innerText = formattedTime ? formattedTime + ' : ' + msg.text : msg.text;
            el.style.backgroundColor = msg.durationSeconds > 0 ? '#fff8e1' : '';
        }

        var duration = msg.duration;
        if (isNaN(duration) || duration < 500) duration = 2000;

        messagePlayTimeout = setTimeout(playNextMessage, duration);
    }

    function toggleMessageView() {
        messageToggleState = (messageToggleState === 'currentmessage') ? 'allmessages' : 'currentmessage';
        messageToggleFirstLoad = true;

        if (messageToggleState !== 'currentmessage' && messagePlayTimeout) {
            clearTimeout(messagePlayTimeout);
            messagePlayTimeout = null;
        }

        updateMessageToggle(dataobj);
    }

    // Attach click handler when DOM ready (startScript runs on body onload)
    function attachMessageToggleHandler() {
        var el = geid('messageToggle');
        if (el && !el.messageToggleHandlerAttached) {
            el.addEventListener('click', toggleMessageView);
            el.messageToggleHandlerAttached = true;
        }

        var clearButton = geid('clearMessagesButton');
        if (clearButton && !clearButton.clearMessagesHandlerAttached) {
            clearButton.addEventListener('click', clearMessages);
            clearButton.clearMessagesHandlerAttached = true;
        }
    }

    function clearMessages() {
        var button = geid('clearMessagesButton');
        if (!button || button.disabled) return;
        button.disabled = true;

        loadRemote('/clearmessages', function () {
            button.disabled = false;
            var payload = dataobj && dataobj.configstate ? dataobj.configstate : dataobj;
            if (payload) {
                payload.currentmessage = '';
                payload.allmessages = '';
            }
            updateMessageToggle(dataobj);
        }, function () {
            button.disabled = false;
            console.error('Unable to clear messages');
            alert('Unable to clear messages. Please try again.');
        });
    }
</script>
