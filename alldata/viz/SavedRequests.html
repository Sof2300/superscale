<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <script src="jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="jquery.dataTables.min.css">
    <script src="jquery.dataTables.min.js"></script>

    <script src="BlockVizDataProcess.js"></script>
    <script src="BlockVizCommon.js"></script>

    <title>TableView</title>

    <style>
        body { font-family: FreeSans, Arimo, 'Droid Sans', Helvetica, Arial, sans-serif; padding: 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .page-header a { background: #666; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; }
        .page-header a:hover { background: #444; }

        .request-block { margin-bottom: 50px; background: white; border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .request-title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .request-title-bar h2 { margin: 0; color: #0056b3; }
        .request-title-bar a.edit-btn { background: #0056b3; color: white; padding: 6px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .request-title-bar a.edit-btn:hover { background: #004494; }

        .req-info { font-size: 0.9em; color: #555; margin-bottom: 10px; background: #f9f9f9; padding: 10px; border-radius: 4px; }

        /* Dense Table Styles */
        table.dataTable { font-size: 0.85em; width: 100%; border-collapse: collapse; }
        table.dataTable th, table.dataTable td { padding: 3px 6px; white-space: nowrap; box-sizing: border-box; border: 1px solid #ddd; text-align: left; }
        table.dataTable th { background-color: #f4f4f4; position: sticky; top: 0; z-index: 2; padding-top: 6px; padding-bottom: 6px; }
        table.dataTable th:hover { background-color: #e0e0e0; }
        td.boldColumn { font-weight: bold; }

        table.dataTable tfoot th { position: sticky; top: 35px; background: #fff8d5; font-weight: bold; z-index: 3; border-top: 2px solid #999; }

        /* --- TOOLTIP STYLING ADDED HERE --- */
        #blockInfoBubble {
            display: none; position: absolute; background: white; border: 1px solid #888;
            padding: 12px; max-width: 600px; max-height: 400px; overflow: auto;
            box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 10000;
            font-family: monospace; font-size: 1.1em; white-space: pre; color: #000; line-height: 1.3;
        }

        .delete-btn { background:#c62828; color:white; border:none; border-radius:4px; padding:6px 15px; cursor:pointer; font-weight:bold; }
        .delete-btn:hover { background:#a61f1f; }
    </style>

    <script>
        let parsedTableData = [];
        let tableFiltersMap = {};
        let blockInfoIndex = {}; // Ensure global scope for raw text mapping

        $(document).ready(function() {
            let savedDataRaw = localStorage.getItem('savedRequests');
            let savedRequests = savedDataRaw ? JSON.parse(savedDataRaw) : [];
            savedRequests.sort((a, b) => a.name.localeCompare(b.name));

            if(savedRequests.length === 0) {
                $('#requestsContainer').html('<p>No requests saved yet.</p>');
                return;
            }

            var xhttp = new XMLHttpRequest();
            xhttp.addEventListener("load", function () {
                if (this.status == 200) {

                    let tdata2 = removeCancels(this.response);
                    let tdata3 = removeConsecutiveDuplicates(tdata2);

                    // FIXED: Generate the raw text logs to power the Tooltip!
                    if (typeof buildBlockInfoIndex === 'function') {
                        buildBlockInfoIndex(tdata3);
                    }

                    var headers = fetchHeaders(2, tdata3);
                    var orderedheaders = preorder.slice();
                    orderedheaders = [...new Set([...orderedheaders, ...headers])];

                    parsedTableData = buildTable(tdata3, orderedheaders, sums, formulatosubstrate);

                    let dtHeaders = parsedTableData[0].map((h, colIndex) => ({
                        title: h, defaultContent: "",
                        className: (h === "id" || h === "blockdate" || h === "totalharvest") ? "boldColumn" : "",
                        render: function (data, type, row) {
                            if (data == null) return "";
                            if (h === "BE") {
                                let num = parseFloat(String(data).replace("%",""));
                                if (type === "sort" || type === "type") return num;
                                return data;
                            }
                            if (h === "blockdate" || h.endsWith("date")) {
                                let p = String(data).split("/");
                                if (p.length === 3) {
                                    let ts = new Date(2000 + Number(p[2]), Number(p[1])-1, Number(p[0])).getTime();
                                    if (type === "sort" || type === "type") return ts;
                                }
                                return data;
                            }
                            if (h === "Age" || h === "spawn" || h === "totalsubstrate" || h === "totalharvest" || h === "harvestcount" || /^harvest\d+$/.test(h)) {
                                let n = Number(data);
                                if (!isNaN(n) && (type === "sort" || type === "type")) return n;
                            }
                            return data;
                        }
                    }));

                    renderTablesUI(savedRequests, dtHeaders);
                }
            });
            xhttp.open("GET", "../data.txt");
            xhttp.send();

            $(document).on("click", ".delete-btn", function () {
                const name = $(this).data("name");
                if (!confirm(`Delete request "${name}" ?`)) return;
                let saved = JSON.parse(localStorage.getItem("savedRequests") || "[]");
                saved = saved.filter(r => r.name !== name);
                localStorage.setItem("savedRequests", JSON.stringify(saved));
                location.reload();
            });

            // UPDATED TOOLTIP ROW CLICK LISTENER
            $(document).on('click', 'table.dataTable tbody tr', function(e) {
                let tableId = $(this).closest('table').attr('id');
                let tableApi = $('#' + tableId).DataTable();
                let row = tableApi.row(this).data();
                if(!row) return;

                let headers = parsedTableData[0];
                let idxId = headers.indexOf("id");
                let idxBE = headers.indexOf("BE");
                let idxTotalH = headers.indexOf("totalharvest");
                let idxHarvCount = headers.indexOf("harvestcount");

                let id = row[idxId];
                let be = row[idxBE] ? row[idxBE] : "N/A";
                let totalH = row[idxTotalH] ? row[idxTotalH] + "g" : "0g";
                let hCount = row[idxHarvCount] || 0;

                let info = blockInfoIndex[id];
                let rawLog = info ? info.join("\n") : "No raw data available.";
                let tooltipContent = `harvest: ${totalH}, count: ${hCount}, be: ${be}\n--------------------------\n${rawLog}`;

                $("#blockInfoBubble").text(tooltipContent).css({ left: e.pageX + 10, top: e.pageY + 10 }).show();
            });

            // HIDE TOOLTIP ON CLICK OUTSIDE
            $(document).on('click', function(e) {
                if(!$(e.target).closest("table.dataTable").length && !$(e.target).closest("#blockInfoBubble").length) {
                    $("#blockInfoBubble").hide();
                }
            });
        });

        // DataTables Search Algorithm
        $.fn.dataTable.ext.search.push(function (settings, searchData, index, rowData, counter) {
            let req;
            if (typeof tableFiltersMap !== 'undefined' && tableFiltersMap[settings.nTable.id]) {
                req = tableFiltersMap[settings.nTable.id];
            } else {
                return true;
            }
            if (!req) return true;

            let input = (req.search || "").toLowerCase();
            let allChecks = [];
            let conditionRegex = /([a-z0-9_]+)\s*(==|!=|<=|>=|<|>)\s*(-?\d+(?:\.\d+)?|empty)/gi;

            input = input.replace(conditionRegex, function(match, colName, op, val) {
                let isMissing = (val.toLowerCase() === 'empty');
                allChecks.push({ type: 'numeric', col: colName.toLowerCase(), op: op, val: isMissing ? 'empty' : parseFloat(val) });
                return "";
            });

            let words = input.split(/\s+/).filter(w => w.trim() !== "");
            for (let w of words) {
                let isNegation = w.startsWith("!");
                let searchTerm = isNegation ? w.substring(1) : w;
                if (searchTerm !== "") allChecks.push({ type: 'text', term: searchTerm, isNegation: isNegation });
            }

            if (allChecks.length > 0) {
                let rowText = searchData.join(" ").toLowerCase();
                let matchText = req.isAnd ? true : false;
                let headers = parsedTableData[0];

                for (let check of allChecks) {
                    let conditionMet = false;
                    if (check.type === 'numeric') {
                        let colIndex = headers.findIndex(h => h.toLowerCase() === check.col);
                        if (colIndex >= 0) {
                            let cellValue = rowData[colIndex];
                            let isEmpty = (cellValue === undefined || cellValue === null || String(cellValue).trim() === "");

                            if (check.val === 'empty') {
                                if (check.op === '==') conditionMet = isEmpty;
                                else if (check.op === '!=') conditionMet = !isEmpty;
                            } else if (!isEmpty) {
                                if (typeof cellValue === 'string' && cellValue.endsWith('%')) {
                                    cellValue = parseFloat(cellValue);
                                } else {
                                    cellValue = Number(cellValue);
                                }
                                if (!isNaN(cellValue)) {
                                    if (check.op === '==') conditionMet = (cellValue === check.val);
                                    else if (check.op === '!=') conditionMet = (cellValue !== check.val);
                                    else if (check.op === '<') conditionMet = (cellValue < check.val);
                                    else if (check.op === '<=') conditionMet = (cellValue <= check.val);
                                    else if (check.op === '>') conditionMet = (cellValue > check.val);
                                    else if (check.op === '>=') conditionMet = (cellValue >= check.val);
                                }
                            }
                        }
                    } else if (check.type === 'text') {
                        let containsTerm = rowText.includes(check.term);
                        conditionMet = check.isNegation ? !containsTerm : containsTerm;
                    }
                    if (req.isAnd) {
                        if (!conditionMet) { matchText = false; break; }
                    } else {
                        if (conditionMet) { matchText = true; break; }
                    }
                }
                if (!matchText) return false;
            }

            if (req.dateFilter && req.dateFilter.enabled) {
                let colName = req.dateFilter.column;
                let colIndex = parsedTableData[0].indexOf(colName);
                if (colIndex >= 0) {
                    let val = rowData[colIndex];
                    if (!val) return false;
                    let p = String(val).split("/");
                    if (p.length !== 3) return false;
                    let rowDate = new Date(2000 + Number(p[2]), Number(p[1])-1, Number(p[0])).getTime();
                    if (req.dateFilter.from && rowDate < new Date(req.dateFilter.from).getTime()) return false;
                    if (req.dateFilter.to && rowDate >= new Date(req.dateFilter.to).getTime() + 86400000) return false;
                }
            }
            return true;
        });

        function renderTablesUI(savedRequests, dtHeaders) {
            let dtData = parsedTableData.slice(1);
            let container = $('#requestsContainer');
            container.empty();
            let footerHtml = parsedTableData[0].map(() => "<th></th>").join("");

            savedRequests.forEach((req, idx) => {
                let tableId = "dt_" + idx;
                tableFiltersMap[tableId] = req;

                let searchBadge = req.search ?
                    `<span style="font-size: 0.65em; font-weight: normal; color: #444; background: #e0e0e0; padding: 4px 10px; border-radius: 12px; border: 1px solid #ccc;">
                        <strong>${req.search}</strong>
                    </span>` : '';

                let html = `
                    <div class="request-block">
                        <div class="request-title-bar">
                            <h2 style="display: flex; align-items: center; gap: 15px;">
                                ${req.name}
                                ${searchBadge}
                            </h2>
                            <div style="display:flex; gap:8px;">
                                <button class="delete-btn" data-name="${req.name}">Delete</button>
                                <a href="BlockViz.html?loadReq=${encodeURIComponent(req.name)}" class="edit-btn">Re-Edit Request →</a>
                            </div>
                        </div>
                        <table id="${tableId}" class="display" style="width:100%">
                            <tfoot><tr>${footerHtml}</tr></tfoot>
                        </table>
                    </div>
                `;
                container.append(html);

                $('#' + tableId).DataTable({
                    data: dtData,
                    columns: dtHeaders,
                    footer: true,
                    deferRender: true,
                    pageLength: 10,
                    dom: '<"top"ilp>rt<"bottom"p><"clear">',
                    order: [],
                    scrollX: false,
                    footerCallback: function () {
                        if (typeof updateAverageRow === 'function') {
                            updateAverageRow(this.api(), tableId, parsedTableData[0]);
                        }
                    },
                    drawCallback: function () {
                        if (typeof updateAverageRow === 'function') {
                            updateAverageRow(this.api(), tableId, parsedTableData[0]);
                        }
                    },
                    createdRow: function(row, data, dataIndex) {
                        let speciesIndex = parsedTableData[0].indexOf("species");
                        if (typeof getSpeciesColor === 'function') {
                            let color = getSpeciesColor(data[speciesIndex]);
                            if(color) $(row).find("td").css("background-color", color);
                        }
                    }
                });

                setTimeout(() => {
                    if ($.fn.DataTable.isDataTable('#' + tableId)) {
                        $('#' + tableId).DataTable().columns.adjust();
                    }
                }, 50);
            });
        }
    </script>
</head>
<body>

<div class="page-header">
    <h1>Table View</h1>
    <div style="display: flex; gap: 10px;">
        <a href="SavedRequestsGraphic.html" style="background: #0056b3;">🎨 Graphic View</a>
        <a href="BlockViz.html">← Back to Main View</a>
    </div>
</div>

<div id="requestsContainer">
    <!-- Tables will be dynamically injected here -->
</div>

<!-- FIXED: ADDED THE HTML DIV REQUIRED TO RENDER THE TOOLTIP -->
<div id="blockInfoBubble"></div>

</body>
</html>
