<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Cache-control" content="public">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SuperScale Flatten Data</title>

    <style>
        .pricename {
            font-size: 80%;
        }

        .priceval {
            font-size: 80%;
        }

        .valclass {
            width: 97%;
            margin-top: 7px;
        }

        .titleclass {
            font-size: 80%;
            vertical-align: center;
            float: right;
        }

        h1 {
            font-size: 1.75em;
            margin: .67em 0;
        }

        body {
            font-family: FreeSans, Arimo, 'Droid Sans', Helvetica, Arial, sans-serif;
        }

        /*  .dygraph-legend { text-align: right; }*/
        .dygraph-roller {
            position: absolute;
            x: 10;
            z-index: 10;
        }

        /* --- New Table and Search Styles --- */
        #searchInput {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            box-sizing: border-box;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin: 5px;
        }

        #dataTable {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.9em;
        }

        #dataTable th, #dataTable td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        #dataTable th {
            background-color: #f4f4f4;
            user-select: none;
            position: sticky;
            top: 0;
        }

        #dataTable th:hover {
            background-color: #e0e0e0;
        }

        #dataTable tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>

    <script>
        var geid = document.getElementById.bind(document);

        function loadRemote(addr, f, err) {
            var xhttp = new XMLHttpRequest();
            xhttp.addEventListener("load", function () { if (this.status != 200) err.bind(this)(); else f.bind(this)(); });
            if (err) xhttp.addEventListener("error", err);
            xhttp.open("GET", addr);
            xhttp.setRequestHeader('x-Date', Math.floor((new Date().getTime()) / 1000));
            xhttp.send();
        }

        window.onload = function () {
            console.log("loading");
            loadDataFile();
        };

        var loadingData = false;

        function loadDataFile() {
            if (loadingData) return; // don't reload if previous load did not finish
            var timing = new Date().getTime();
            loadRemote('../data.txt', function () {
                    loading = false;
                    console.log('data load delay:' + (new Date().getTime() - timing) / 1000);
                    dataLoaded.bind(this)(this.response);
                }
                , function () { loading = false; geid("content").disabled = true; });    //stay disabled
            loading = true;
        }

        /**
         * Removes any line that is an exact duplicate of the line immediately preceding it.
         * @param {string} td - The raw text data.
         * @returns {string} - The cleaned text data with consecutive duplicates removed.
         */
        function removeConsecutiveDuplicates(td) {
            let lines = td.split('\n');
            if (lines.length < 2) {
                return td; // Can't have duplicates if there are less than 2 lines.
            }

            let i = 0;
            // We check up to the second-to-last line.
            while (i < lines.length - 1) {
                // If the current line is the same as the next one...
                if (lines[i] === lines[i + 1]) {
                    // ...remove the next line.
                    lines.splice(i + 1, 1);
                } else {
                    i++;
                }
            }
            return lines.join('\n');
        }

        function dataLoaded(tdata) {
            geid("textcontent").value = tdata;
            // First, remove the consecutive duplicate lines.
            let tdata2 = removeCancels(tdata);
            let tdata3 = removeConsecutiveDuplicates(tdata2);
            // Then, process the cancellations on the cleaned data.
            processData(tdata3);
        }

        /**
         * Finds and removes "cancel" commands and their corresponding target entries.
         * It correctly handles multiple cancellations and avoids reprocessing already-cancelled lines.
         */
        function splitIntoLines(td) {
            let ntd = td.replaceAll("\r", "")
            return ntd.split("\n");
        }

        function splitLine(line) {
            let sub = line.split(",");
            if (sub.length != 4) {
                throw new Error("Line has more or less than 4 fields!");
            }
            for (let n = 0; n < sub.length; n++) {
                sub[n] = sub[n].trim();
            }
            sub[2] = sub[2].toLowerCase();    // commands are always lowercase
            if (sub[2] == "cancel") sub[3] = sub[3].toLowerCase(); // to lowercase if it's an argument of a cancel, ie refer to a command
            return sub;
        }

        function removeCancels(td) {
            let tde = splitIntoLines(td);
            let toremove = new Set();

            for (let r = 0; r < tde.length; r++) {
                if (tde[r].length == 0) continue; //skip empty line
                let sub = splitLine(tde[r]);

                if (sub[2] == "cancel") {
                    for (let k = r - 1; k >= 0; k--) {
                        if (toremove.has(k)) {
                            continue;
                        }

                        let ksub = tde[k].split(",");
                        if (ksub[1] == sub[1] && (ksub[2] == sub[3] || (sub[3] == "" && ksub[2] != "cancel"))) {
                            toremove.add(k);
                            toremove.add(r);
                            break;
                        }
                    }
                }
            }

            if (toremove.size > 0) {
                let toremoveArray = Array.from(toremove);
                toremoveArray.sort((a, b) => b - a);

                for (let l of toremoveArray) {
                    tde.splice(l, 1);
                }
            }

            return tde.join("\n");
        }

        var preorder = ['id', 'species', 'blockdate', 'formula', 'totalsubstrate', 'harvest', 'spawn', 'spawncode'];
        var keeplast = ["harvest"];
        var sums = ["harvest"];
        var aggregated = { "harvest": 7 };    //aggregate harvest if less than 7 days apart
        var calculatedfields = { "Age": { "substract": ["now", "blockdate"] }, "BE": { "divide": ["totalharvest", "totalsubstrate"] } };
        var formulatosubstrate = {
            "formula":
                {
                    "Ppx7": { "totalsubstrate": "1850" },
                    "aPpx7": { "totalsubstrate": "1850" },
                    "Pcx6": { "totalsubstrate": "1580" },
                    "Pn2x6": { "totalsubstrate": "1580" },
                    "Pn3x6": { "totalsubstrate": "1580" },
                    "Pn310x6": { "totalsubstrate": "1415" },
                    "Ppx6": { "totalsubstrate": "1580" },
                    "Ppx5.5": { "totalsubstrate": "1450" },
                    "bPpx5.5": { "totalsubstrate": "1450" },
                    "aPpx5.5": { "totalsubstrate": "1450" },
                    "Kx6": { "totalsubstrate": "1580" },
                    "SDx6": { "totalsubstrate": "1580" },
                    "bSDx6": { "totalsubstrate": "1580" },
                    "Oakx6": { "totalsubstrate": "1580" },
                    "SFtx6": { "totalsubstrate": "1580" },
                    "SFtx6plus": { "totalsubstrate": "1580" },
                    "bSFtx6": { "totalsubstrate": "1580" },
                    "bSFTx6": { "totalsubstrate": "1580" },
                    "PpBr20Sg10x5.5": { "totalsubstrate": "1450" },
                    "SFtBr20Sg10x6plus": { "totalsubstrate": "1580" },
                    "SFtSgx6plus": { "totalsubstrate": "1580" },
                }
        };

        function processData(tdata) {
            var headers = fetchHeaders(2, tdata);
            var orderedheaders = preorder.slice();
            orderedheaders = [...new Set([...orderedheaders, ...headers])]
            console.log(orderedheaders);

            let table = buildTable(tdata, orderedheaders, sums, formulatosubstrate);

            // --- Instead of text output to CSV, generate interactive table ---
            window.tableData = table;
            renderTableHTML();

            let perday = buildPerDay(tdata, table);
            let perdaycsv = tableToCSV(perday);
            console.log(perday);
            geid("perdayoutput").value = perdaycsv;
        }

        // --- NEW HTML TABLE MULTISORT/SEARCH METHODS START HERE ---
        let currentSort = { col: -1, dir: 1 };

        function renderTableHTML() {
            let table = document.getElementById("dataTable");
            let thead = table.getElementsByTagName("thead")[0];
            let tbody = table.getElementsByTagName("tbody")[0];
            thead.innerHTML = "";
            tbody.innerHTML = "";

            if (!window.tableData || window.tableData.length === 0) return;

            // Header Generation
            let headers = window.tableData[0];
            let trHeader = document.createElement("tr");
            for (let i = 0; i < headers.length; i++) {
                let th = document.createElement("th");
                th.innerText = headers[i] + (currentSort.col === i ? (currentSort.dir === 1 ? " ▲" : " ▼") : "");
                th.style.cursor = "pointer";
                th.onclick = function () { sortTable(i); };
                trHeader.appendChild(th);
            }
            thead.appendChild(trHeader);

            // Row Generation
            for (let r = 1; r < window.tableData.length; r++) {
                let row = window.tableData[r];
                let tr = document.createElement("tr");
                for (let c = 0; c < headers.length; c++) {
                    let td = document.createElement("td");
                    let cellVal = row[c];
                    if (cellVal === undefined || cellVal === null) cellVal = "";
                    td.innerText = cellVal;
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }

            applySearch(); // Maintain filtering after re-renders
        }

        function sortTable(colIndex) {
            if (currentSort.col === colIndex) {
                currentSort.dir *= -1; // Toggle direction
            } else {
                currentSort.col = colIndex;
                currentSort.dir = 1;
            }

            let headers = window.tableData[0];
            let rows = window.tableData.slice(1);

            rows.sort((a, b) => {
                let valA = a[colIndex] !== undefined && a[colIndex] !== null ? a[colIndex].toString().toLowerCase() : '';
                let valB = b[colIndex] !== undefined && b[colIndex] !== null ? b[colIndex].toString().toLowerCase() : '';

                // Date Sorting check utilizing existing `makeDate` method
                let isDateStr = (s) => {
                    let p = s.split('/');
                    return p.length === 3 && !isNaN(p[0]) && !isNaN(p[1]) && !isNaN(p[2]);
                };
                if (isDateStr(valA) && isDateStr(valB)) {
                    let dA = makeDate(valA).getTime();
                    let dB = makeDate(valB).getTime();
                    return (dA - dB) * currentSort.dir;
                }

                // Numerical Sorting check (handling possible % symbols like in BE column)
                let numA = parseFloat(valA.replace('%', ''));
                let numB = parseFloat(valB.replace('%', ''));
                let isA_num = !isNaN(numA) && !isNaN(valA.replace('%', '').trim()) && valA.trim() !== '';
                let isB_num = !isNaN(numB) && !isNaN(valB.replace('%', '').trim()) && valB.trim() !== '';

                if (isA_num && isB_num) {
                    return (numA - numB) * currentSort.dir;
                }

                // Default String comparison
                if (valA < valB) return -1 * currentSort.dir;
                if (valA > valB) return 1 * currentSort.dir;
                return 0;
            });

            window.tableData = [headers, ...rows];
            renderTableHTML();
        }

        function applySearch() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let words = input.split(" ").filter(w => w.trim() !== ""); // Space-separated multi search

            let tbody = document.getElementById("dataTable").getElementsByTagName("tbody")[0];
            let rows = tbody.getElementsByTagName("tr");

            for (let i = 0; i < rows.length; i++) {
                let rowText = rows[i].innerText.toLowerCase();
                if (words.length === 0) {
                    rows[i].style.display = ""; // No search terms -> show row
                } else {
                    let match = false;
                    // If row contains ANY ONE of the typed words, display it.
                    for (let w of words) {
                        if (rowText.includes(w)) {
                            match = true;
                            break;
                        }
                    }
                    rows[i].style.display = match ? "" : "none";
                }
            }
        }
        // --- END OF NEW HTML TABLE METHODS ---

        /////////// PERDAY PART
        function buildPerDay(tdata, otable) {
            let cdata = tdata.split("\n");
            let perday = [];
            perday.push(["date", "total"]);
            for (let r of cdata) {
                let cr = r.split(",");
                if (cr[2] != "harvest") continue;
                let species = findSpecies(cr[1], otable);
                if (species === undefined) species = "-";
                perday = updatePerdayHeaders(species, perday);
                let index = fetchIndex(cr[0], perday);
                let nr = [];
                if (index == -1) addNewRow(cr[0], cr[3], species, perday);
                else updateRow(index, cr[3], species, perday);
            }
            function sortDates(a, b) {
                if (a[0] == "date") return -1;
                if (b[0] == "date") return 1;
                let sa = a[0].split("/");
                let sb = b[0].split("/");
                let da = new Date("20" + sa[2], sa[1], sa[0]);
                let db = new Date("20" + sb[2], sb[1], sb[0]);
                if (da < db) return -1;
                if (da > db) return 1;
                return 0;
            }
            perday.sort(sortDates);
            return perday;
        };

        function updatePerdayHeaders(species, perday) {
            for (let h of perday[0]) if (h == species) return perday;
            perday[0].push(species);
            for (let i = 1; i < perday.length; i++) perday[i].push(0);
            return perday;
        }

        function updateRow(index, amount, species, perday) {
            perday[index][1] += Number(amount);
            let i = 2;
            for (; i < perday[0].length; i++) if (perday[0][i] == species) break;
            if (i < perday[0].length) perday[index][i] += Number(amount);
        }

        function addNewRow(date, amount, species, perday) {
            let nr = [date, Number(amount)];
            for (let i = 2; i < perday[0].length; i++) { if (perday[0][i] == species) nr.push(Number(amount)); else nr.push(0); }
            perday.push(nr);
        }
        function fetchIndex(date, table) {
            for (let i in table) if (table[i][0] == date) return i;
            return -1;
        }
        function findSpecies(id, table) {
            for (let r of table) {
                if (id == r[0]) return r[1];
            }
            return "";
        }
        /////////// END OF PERDAY PART


        function tableToCSV(table) {
            let csvContent = "";
            table.forEach(function (rowArray) {
                let row = rowArray.join(",");
                csvContent += row + "\r\n";
            });
            return csvContent;
        }

        function buildTable(tdata, headers, sums, transform) {
            var finalheaders = headers.slice();
            var finaltable = [];
            finaltable.push(finalheaders);
            let arr = splitIntoLines(tdata);

            var indexofid = {};
            var sumlengths = {};
            for (var r of arr) {
                if (r.length == 0) continue;
                let l = splitLine(r);

                if (!(l[1] in indexofid)) {
                    indexofid[l[1]] = finaltable.length;
                    var newrow = [];
                    var idindex = headers.indexOf("id");
                    if (idindex >= 0) newrow[idindex] = l[1];
                    finaltable.push(newrow);
                }
                var argindex = headers.indexOf(l[2]);
                if (argindex >= 0) {
                    if (sums.indexOf(l[2]) >= 0) {
                        if (finaltable[indexofid[l[1]]][argindex] === undefined) finaltable[indexofid[l[1]]][argindex] = [];
                        finaltable[indexofid[l[1]]][argindex].push([l[0], l[3]]);
                    }
                    else finaltable[indexofid[l[1]]][argindex] = l[3];
                }
            }
            // convert formula to substrate
            for (var r = 1; r < finaltable.length; r++) {
                for (var f in formulatosubstrate) {
                    var i = finaltable[0].indexOf(f);
                    if (i < 0) continue;
                    let trans = formulatosubstrate[f][finaltable[r][i]];
                    if (trans === undefined) continue;
                    for (let p in trans) {
                        var pi = finaltable[0].indexOf(p);
                        finaltable[r][pi] = trans[p];
                    }
                }
            }
            // calculate sumlengths here rather than during the filling of the table
            for (var r = 1; r < finaltable.length; r++) {
                for (var s of sums) {
                    var i = finaltable[0].indexOf(s);
                    if (i < 0) continue;
                    let tab = finaltable[r][i];
                    if (tab === undefined) continue
                    tab = aggregate(s, tab);
                    finaltable[r][i] = tab;
                    var length = tab.length;
                    sumlengths[s] = length;
                }
            }
            // convert sums to total and add
            let extraheader = {};
            for (let k in calculatedfields) {
                extraheader[k] = finaltable[0].length;
                finaltable[0].push(k);
            }

            for (var s of sums) {
                var i = finaltable[0].indexOf(s);
                if (i >= 0) {
                    finaltable[0][i] = "total" + s;
                    finaltable = insertColumn(finaltable, i + 1);
                    finaltable[0][i + 1] = s + "count";

                    finaltable[0].push("last" + s);
                    finaltable[0].push("last" + s + "date");
                }

                if (sumlengths[s] > 0) extraheader[s] = finaltable[0].length;
                for (var suml = 1; suml <= sumlengths[s]; suml++) {
                    finaltable[0].push(s + suml);
                    finaltable[0].push(s + suml + "date");
                }
            }
            for (var r = 1; r < finaltable.length; r++) {
                for (var s of sums) {
                    var i = finaltable[0].indexOf("total" + s);
                    if (i < 0) continue;
                    let tab = finaltable[r][i], tsum = 0, ind = 0;
                    if (tab === undefined) continue;
                    let lastt;
                    for (var t of tab) {
                        finaltable[r][extraheader[s] + ind * 2] = t[1];
                        finaltable[r][extraheader[s] + ind * 2 + 1] = t[0];
                        tsum += Number(t[1]);
                        ind++;
                        lastt = t;
                    }
                    finaltable[r][i] = tsum;
                    finaltable[r][i + 1] = tab.length;
                    finaltable[r][extraheader[s] - 2] = lastt[1];
                    finaltable[r][extraheader[s] - 1] = lastt[0];
                }
            }
            for (var r = 1; r < finaltable.length; r++) {
                for (var c in calculatedfields) {
                    var target = finaltable[0].indexOf(c);
                    if (target < 0) continue;
                    let op = calculatedfields[c];
                    let optype = Object.keys(op).pop();
                    let args = op[optype];
                    let isdate = false;
                    for (let a of args) if (isDateField(a)) { isdate = true; break; }
                    let argvals = [];
                    function fetchfields(field) {
                        if (field == "now") return formatDate(new Date());
                        let findex = finaltable[0].indexOf(field);
                        return finaltable[r][findex];
                    }
                    let stop = false;
                    for (let a of args) {
                        let fv = fetchfields(a);
                        if (fv === undefined) { stop = true; break; }
                        argvals.push(fv);
                    }
                    if (stop) continue;
                    if (optype == "substract") {
                        if (isdate) finaltable[r][target] = daysDiff(argvals[0], argvals[1]);
                        else finaltable[r][target] = argvals[0] - argvals[1];
                    }
                    if (optype == "divide") finaltable[r][target] = "" + Math.round(100 * argvals[0] / argvals[1]) + "%";
                }
            }
            return finaltable;
        }

        function insertColumn(array, index) {
            for (var r in array) array[r].splice(index, 0, undefined);
            return array;
        }

        function formatDate(d) {
            return "" + d.getDate() + "/" + d.getMonth() + "/" + (d.getFullYear() - 2000);
        }

        function isDateField(text) {
            if (text.includes("date")) return true;
            if (text == "now") return true;
            return false;
        }

        function makeDate(d) {
            let nd = new Date(0);
            if (d === undefined) {
                console.log();
            }
            let datetab = d.split("/");
            nd.setDate(datetab[0]);
            nd.setMonth(datetab[1]);
            nd.setYear("20" + datetab[2]);
            return nd;
        }

        function daysDiff(d1, d2) {
            let diff = (makeDate(d1).getTime() - makeDate(d2).getTime()) / (1000 * 3600 * 24);
            if (diff < 0) diff = -diff;
            return Math.floor(diff);
        }

        function aggregate(name, odata) {
            function mindist(date, table) {
                let min;
                for (let t of table) {
                    let diff = daysDiff(t[0], date);
                    if (min === undefined) min = diff;
                    else if (diff < min) min = diff;
                }
                return min;
            }
            function mergedata(tab) {
                let d = 0, v = 0;
                for (let t of tab) {
                    if (d == 0 || makeDate(d).getTime() > makeDate(t[0]).getTime()) d = t[0];
                    v += Number(t[1]);
                }
                let date = d;
                return [date, v];
            }
            if (!(name in aggregated)) return odata;
            if (odata === undefined) {
                console.log();
            }
            var data = odata.slice();
            var period = aggregated[name];
            var toaggregate = [], ndata = [];
            while (data.length > 0) {
                for (var d = 0; d < data.length; d++) {
                    if (toaggregate.length == 0) { toaggregate.push(data[d]); data.splice(d, 1); d--; continue; }
                    var dist = mindist(data[d][0], toaggregate)
                    if (dist <= period) { toaggregate.push(data[d]); data.splice(d, 1); d--; }
                }
                ndata.push(mergedata(toaggregate));
                toaggregate = [];
            }
            return ndata;
        }

        function fetchHeaders(col, data) {
            var arr = data.split("\n"), headers = {};
            for (var r of arr) {
                if (r.length == 0) continue;
                var l = r.split(",");
                headers[l[col]] = 1;
            }
            return Object.keys(headers);
        }

    </script>
