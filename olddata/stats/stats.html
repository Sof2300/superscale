var geid=document.getElementById.bind(document);
function loadRemote(addr,f,err){
	var xhttp = new XMLHttpRequest();
	
	xhttp.addEventListener("load", f);
	if(err) xhttp.addEventListener("error", err);
	xhttp.open("GET", addr);
	xhttp.setRequestHeader('x-Date', Math.floor((new Date().getTime()) / 1000));
	xhttp.send();
}

function disenableload(url,idarray){
	if(idarray) for(var k in idarray) geid(idarray[k]).disabled=true;
	function f(){
		if(idarray) for(var k in idarray) {
			var it=geid(idarray[k]);
			if(it) it.disabled=false;
			else console.log("disenableload:: item is undefined :"+idarray[k]);
		}
		loadjson();
	}
	loadRemote(url,f,f);
}

function parseData({text}){
    var lines=text.split("\n");
    var result=[];
    for(var line in lines) {
        var objline=[];
        var items;
        if(lines[line].length>0) items=lines[line].split(",");
        for(var item in items) {
            var val=items[item];
            if(isNaN(Number(val))) objline.push(val);
            else objline.push(Number(val));
        }
        if(objline.length>0) result.push(objline);

    }
    return result;
}
