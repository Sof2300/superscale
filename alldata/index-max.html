var geid=document.getElementById.bind(document);
function loadRemote(addr,f,err){
	var xhttp = new XMLHttpRequest();
	xhttp.addEventListener("load", function(){if(this.status!=200) err.bind(this)();else f.bind(this)();});
	if(err) xhttp.addEventListener("error", err);
	xhttp.open("GET", addr);
	xhttp.setRequestHeader('x-Date', Math.floor((new Date().getTime()) / 1000));
	xhttp.send();
}

function setDisabledIds(ids,newstate) {
   // console.log("setDisabledIds "+newstate+" "+ids);
    for(var k in ids) {
        var el = geid(ids[k]);
        if (el) {
            // iOS FIX: If we disable the focused input, iOS immediately hides the keyboard.
            // We identify the 'id' input and use readOnly instead of disabled.
            if (ids[k].indexOf("_input_id") !== -1) {
                el.readOnly = newstate;
                el.style.opacity = newstate ? "0.6" : "1"; // Keep visual feedback
            } else {
                el.disabled = newstate;
            }
        }
    }
}

function focusIdField() {
    // Make sure the UI has been built
    if (typeof currentcommandUI !== 'undefined' && currentcommandUI && currentcommandUI.commandlineui) {
        // Fetch the component representing the 'id' field
        var idComp = currentcommandUI.commandlineui.row.valuecomps["id"];
        if (idComp && idComp.id) {
            // Use setTimeout to ensure the DOM is painted and elements are unlocked
      //      setTimeout(function() {
                var idEl = geid(idComp.id);
                if (idEl && !idEl.disabled) {
                    idEl.focus();
                    // Move the cursor to the end of the text if there's already a value
                    if (typeof idEl.setSelectionRange === "function" && idEl.value) {
                        idEl.setSelectionRange(idEl.value.length, idEl.value.length);
                    }
                }
         //   }, 50);
        }
    }
}

function disenableload(url,idarray,reload=true, custf, custerr){
    userActionPending = true;

    focusIdField();

    setDisabledIds(idarray,true);
    function f(){
        custf.bind(this)();
        if(reload) setTimeout(function(){enableloadjson(idarray)},200);
    }
    function fe(){
        custerr.bind(this)();
        if(reload) setTimeout(function(){enableloadjson(idarray)},200);
    }
    loadRemote(url,f,fe);
}
function enableloadjson(idarray){
    if(loading) {setDisabledIds(idarray,false);return;} // don't reload if previous load did not finish
    var timing=new Date().getTime();
    //	var it=geid("volume");
    //	if(it) it.style.color="lightgray";
    loadRemote('/json',function(){
            setDisabledIds(idarray,false);
            loading=false;
            geid("content").disabled=false;
            console.log('enable json load delay:'+(new Date().getTime()-timing)/1000);
            reqListener.bind(this)();}
        ,function(){
            loading=false;
            geid("content").disabled=true;
    });    //stay disabled
    loading=true;
}

function updatePage(tobj){

function dataloaded(){
   // console.log(this.responseText);
    var jsonstring=this.responseText;
    while(jsonstring[jsonstring.length-1]=='\n') jsonstring=jsonstring.substr(0,jsonstring.length-1);
    jsonstring=jsonstring.replace(/\r/g,"");
    var arr=jsonstring.split("\n");
    arr.reverse();
    var nstring=arr.join("\n");
    geid("tarea").textContent=nstring;
    pageUI.updateDataFile(jsonstring);

}

var loadingData=false;
function loadDataFile(){
    if(loadingData) return; // don't reload if previous load did not finish
    var timing=new Date().getTime();    //	var it=geid("volume");    //	if(it) it.style.color="lightgray";
    geid("tarea").disabled=true;
    loadRemote('data.txt',function(){
            loadingData=false;
            geid("tarea").disabled=false;
            console.log('data load delay:'+(new Date().getTime()-timing)/1000);
            dataloaded.bind(this)();}
        ,function(){loadingData=false;geid("content").disabled=true;});    //stay disabled
    loadingData=true;
}

var currentversion=-1, loadingversion;
function updateDataFile(data){
    if(loadingversion==data["configstate"]["data-version"]) currentversion=loadingversion;
    if(currentversion!=data["configstate"]["data-version"]) {
        loadingversion=data["configstate"]["data-version"];
        loadDataFile();
    }
}

function reqListener () {
//		console.log(this.responseText);
		var jsonstring=this.responseText;
        var t = jsonstring.replace(/\r/g, "");
		t = t.replace(/\n/g, "\\n");
		var tobj=JSON.parse(t);

        var isFirstLoad = !init;

		if(!init){showPage(tobj);init=true;}
		else updatePage(tobj);
		dataobj=tobj;
        updateDataFile(tobj);
        // Handle focusing
        if (isFirstLoad || userActionPending) {
            focusIdField();
            userActionPending = false; // Reset the flag
        }
	}

function startScript() {
   // loadMultiJS(["Component.js","ComponentInteractive.js","CommandUI.js","PageUI.js"],function(){
        if(DEBUGOFFLINE) {
            appConfig = {
                "mode": "ST",
                "lastvalnames": ["species", "blockdate", "formula"],
                "sumnames": ["harvest", "substrate"],
                "multivalnames": ["spawn"],
                "defaultcommand": "harvest",
                "tags":["fruit","sale","flies","spent","contaminated","compost","storage","glifada"]
            };
            updateDataFile(JSON.parse(jsonsampledata));showPage();
            focusIdField();
            return ;}
        loading=false;
    function initApp() {
            loadjson();
            var duration = 2000;
            setInterval(loadjson, duration);
        }

    // Load config.json first
    loadRemote('config.json', function() {
            try {
                let text=this.responseText
                while(text.indexOf("//")>=0) { //remove comments like this one, not allowed in json
                    let start=text.indexOf("//");
                    let end=text.indexOf("\n",start);
                    if(end<-1) end=text.length;
                //    console.log(text.length);
                    text=text.substring(0,start)+text.substring(end,text.length);
                 //   console.log(text.length);
                }
                appConfig = JSON.parse(text);
            } catch(e) {
                console.error("Config parse error", e);
            }
            initApp();
        }, function() {
            console.error("Config load error");
            initApp(); // Fallback to starting anyway if it fails
        });
    }
