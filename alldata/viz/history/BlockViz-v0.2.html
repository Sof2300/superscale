<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-control" content="public">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script src="BlockVizDataProcess.js"></script>

    <title>Block Viz</title>

    <style>
        .pricename {
            font-size: 80%;
        }

        .priceval {
            font-size: 80%;
        }

        .valclass {
            width: 97%;
            margin-top: 7px;
        }

        .titleclass {
            font-size: 80%;
            vertical-align: center;
            float: right;
        }

        h1 {
            font-size: 1.75em;
            margin: .67em 0;
        }

        body {
            font-family: FreeSans, Arimo, 'Droid Sans', Helvetica, Arial, sans-serif;
        }

        /* --- Table and Search Styles --- */
        #searchInput {
            width: 100%;
            padding: 8px;
            margin: 5px 0 5px 0;
            box-sizing: border-box;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .search-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .table-container {
            margin: 5px 0;

        }

        #dataTable {

            width: 100%;
            font-size: 0.85em;
        }

        #dataTable th, #dataTable td {
            border: 1px solid #ddd;
            padding: 3px 6px;
            text-align: left;
            line-height: 1.2;
            white-space: nowrap;
            box-sizing: border-box;
        }

        #dataTable th {
            background-color: #f4f4f4;
            user-select: none;
            position: sticky;
            top: 0;
            padding-top: 6px;
            padding-bottom: 6px;
            z-index: 2;
        }

        #dataTable th:hover {
            background-color: #e0e0e0;
        }

        #dataTable tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        thead tr.avgRow th{
            position:sticky;
            top:35px;          /* height of first header row */
            background:#fff8d5;
            font-weight:bold;
            z-index:1;
            border-top:2px solid #999;
        }
    </style>

    <script>
        var geid = document.getElementById.bind(document);

        function loadRemote(addr, f, err) {
            var xhttp = new XMLHttpRequest();
            xhttp.addEventListener("load", function () { if (this.status != 200) err.bind(this)(); else f.bind(this)(); });
            if (err) xhttp.addEventListener("error", err);
            xhttp.open("GET", addr);
            xhttp.setRequestHeader('x-Date', Math.floor((new Date().getTime()) / 1000));
            xhttp.send();
        }

        window.onload = function () {
            console.log("loading");
            loadDataFile();
        };

        var loadingData = false;

        function loadDataFile() {
            if (loadingData) return;
            loadingData = true;
            var timing = new Date().getTime();
            loadRemote('../dataSub.txt', function () {
                    loadingData = false;
                    console.log('data load delay:' + (new Date().getTime() - timing) / 1000);
                    dataLoaded.bind(this)(this.response);
                }
                , function () { loadingData = false; geid("content").disabled = true; });
        }


        let dataTableInstance = null;

        // 1. Tell DataTables how to use our custom AND/OR & !Exclude logic
        $.fn.dataTable.ext.search.push(function (settings, searchData, index, rowData, counter) {
            let input = $('#searchInput').val().toLowerCase();
            let words = input.split(" ").filter(w => w.trim() !== "");
            if (words.length === 0) return true; // Show all if search is empty

            let isAndLogic = $('#searchLogicAnd').is(':checked');
            let rowText = searchData.join(" ").toLowerCase(); // Combines all columns into one string

            let match = isAndLogic ? true : false;
            let validWordsCount = 0;

            for (let w of words) {
                let isNegation = w.startsWith("!");
                let searchTerm = isNegation ? w.substring(1) : w;

                if (searchTerm === "") continue;
                validWordsCount++;

                let containsTerm = rowText.includes(searchTerm);
                let conditionMet = isNegation ? !containsTerm : containsTerm;

                if (isAndLogic) {
                    if (!conditionMet) {
                        return false; // Break early
                    }
                } else {
                    if (conditionMet) {
                        match = true;
                        break; // Break early
                    }
                }
            }
            return validWordsCount === 0 ? true : match;
        });


        function updateAverageRow() {
            if (!dataTableInstance) return;
            const api = dataTableInstance;
            const rows = api.rows({search:'applied'}).data().toArray();
            const headers = window.tableData[0];
            const avgCells = $(".avgRow th");
            headers.forEach((name,col)=>{
                let sum=0;
                let count=0;
                let isPercent=false;

                rows.forEach(r=>{
                    let v=r[col];
                    if(v===undefined || v==="") return;
                    if(typeof v==="string" && v.endsWith("%")){
                        v=parseFloat(v);
                        isPercent=true;
                    }
                    else if(typeof v==="string"){
                        // ignore dates
                        if(v.match(/^\d+\/\d+\/\d+$/))
                            return;
                        v=Number(v);
                    }
                    if(Number.isFinite(v)){
                        sum+=v;
                        count++;
                    }
                });
                if(count===0){
                    avgCells.eq(col).text("");
                }
                else{
                    let avg=sum/count;
                    if(isPercent)
                        avgCells.eq(col).text(avg.toFixed(1)+"%");
                    else
                        avgCells.eq(col).text(avg.toFixed(1));
                }
            });
        }


        // 2. Initialize the table
        function initDataTable() {
            let ts0 = Date.now();

            if (dataTableInstance) {
                dataTableInstance.destroy();
                $('#dataTable').empty(); // Clear out old headers/rows
            }

            const headers = window.tableData[0];

            let dtHeaders = headers.map((h, colIndex) => ({
                title: h,
                defaultContent: "",
                render: function (data, type, row) {

                    if (data == null)
                        return "";

                    // ---------- Percentage ----------
                    if (h === "BE") {

                        let num = parseFloat(String(data).replace("%",""));

                        if (type === "sort" || type === "type")
                            return num;

                        return data;
                    }

                    // ---------- Dates ----------
                    if (h === "blockdate" || h.endsWith("date")) {

                        let p = String(data).split("/");

                        if (p.length === 3) {

                            let ts = new Date(
                                2000 + Number(p[2]),
                                Number(p[1])-1,
                                Number(p[0])
                            ).getTime();

                            if (type === "sort" || type === "type")
                                return ts;
                        }

                        return data;
                    }

                    // ---------- Numeric ----------
                    if (
                        h === "Age" ||
                        h === "spawn" ||
                        h === "totalsubstrate" ||
                        h === "totalharvest" ||
                        h === "harvestcount" ||
                        /^harvest\d+$/.test(h)
                    ) {

                        let n = Number(data);

                        if (!isNaN(n) && (type === "sort" || type === "type"))
                            return n;
                    }

                    return data;
                }
            }));

            let dtData = window.tableData.slice(1);




            dataTableInstance = $('#dataTable').DataTable({
                data: dtData,
                columns: dtHeaders,
                deferRender: true, // MASSIVE performance boost for large datasets
                pageLength: 50, // Enable pagination (shows 50 rows per page)
                dom: '<"top"ilp>rt<"bottom"p><"clear">', // Hides the default DataTables search bar so we can use ours
                order: [], // Prevent default sorting on load
                scrollX: false, // Handles wide tables perfectly
                 //,order: [[, 'desc']]
                headerCallback: function(thead) {
                    let avgRow = $(thead).find("tr.avgRow");
                    if (avgRow.length === 0) {
                        avgRow = $("<tr class='avgRow'></tr>");
                        $(thead).find("th").each(function () {
                            avgRow.append("<th></th>");
                        });
                        $(thead).append(avgRow);
                    }
                    updateAverageRow();
                },
                drawCallback: function () {
                    updateAverageRow();
                },

            });
            setTimeout(() => {
                if (dataTableInstance) dataTableInstance.columns.adjust();
            }, 50);

            console.log("DataTables initialization: " + (Date.now() - ts0) + " ms");
        }

        // 3. Bind our custom search UI to trigger DataTables redraws
        $(document).ready(function() {
            $('#searchInput').on('keyup', function () {
                if (dataTableInstance) dataTableInstance.draw();
            });
            $('#searchLogicAnd').on('change', function () {
                if (dataTableInstance) dataTableInstance.draw();
            });
        });



    </script>
</head>

<body>
<h1 id="title">SuperScale-BlockViz</h1>

<div class="table-container">
    <!-- Notice we removed onkeyup="handleSearchInput()", jQuery handles this now -->
    <input type="text" id="searchInput" placeholder="Search rows (type space-separated words, use ! to exclude, e.g. 'compost !flies')...">

    <div class="search-controls">
        <label>
            <!-- Notice we removed onchange="handleSearchInput()", jQuery handles this now -->
            <input type="checkbox" id="searchLogicAnd">
            Require ALL conditions (AND logic)
        </label>
        <!-- Removed rowCountDisplay span because DataTables generates its own info text at the bottom -->
    </div>

    <!-- DataTables requires an empty table to inject into -->
    <table id="dataTable" class="display" style="width:100%"></table>
</div>
<br>
<h1 id="title">Data Content</h1>
<textarea id="textcontent" readonly rows=7 style="margin:5px;width:100%;white-space: pre;">Loading...</textarea><br>
</body>
</html>
