var geid=document.getElementById.bind(document);
function loadRemote(addr,f,err){
	var xhttp = new XMLHttpRequest();
	
	xhttp.addEventListener("load", f);
	if(err) xhttp.addEventListener("error", err);
	xhttp.open("GET", addr);
	xhttp.setRequestHeader('x-Date', Math.floor((new Date().getTime()) / 1000));
	xhttp.send();
}

function disenableload(url,idarray){
	if(idarray) for(var k in idarray) geid(idarray[k]).disabled=true;
	function f(){
		if(idarray) for(var k in idarray) {
			var it=geid(idarray[k]);
			if(it) it.disabled=false;
			else console.log("disenableload:: item is undefined :"+idarray[k]);
		}
		loadjson();
	}
	loadRemote(url,f,f);
}

function reqListener () {
		console.log(this.responseText);
		var jsonstring=this.responseText;
		var t = jsonstring.replace(/\n/g, "\\n");
		var tobj=JSON.parse(t);
		var keys=Object.keys(tobj)[k];
		for(var k in keys){ 	// iterate and replace 1 level;
			var nk=keys[k].replace(/\\n/g, "\n");
			if(nk!=keys[k]) {tobj[nk]=tobj[k];delete tobj[k];}
			var nv=tobj[nk].replace(/\\n/g, "\n");
			if(nv!=tobj[nk])tobj[nk]=nv;
		}
		if(!init){showPage(tobj);init=true;}
		else updatePage(tobj);
		dataobj=tobj;
	}
function loadjson(){
		if(loading) return; // don't reload if previous load did not finish
		var timing=new Date().getTime();
		//	var it=geid("volume");
		//	if(it) it.style.color="lightgray";
		loadRemote('/json',function(){loading=false;geid("content").disabled=false;console.log('load delay:'+(new Date().getTime()-timing)/1000);reqListener.bind(this)();}
		,function(){loading=false;geid("content").disabled=true;});
		loading=true;
	}
var loading=false;

function startScript() {
	if(DEBUGOFFLINE) {showPage();return ;}
	
	loading=false;
	
	loadjson();
	
	var duration=5000;

}
