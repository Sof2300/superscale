<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-control" content="public">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <script src="jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="jquery.dataTables.min.css">
    <script src="jquery.dataTables.min.js"></script>

    <script src="BlockVizDataProcess.js"></script>

    <title>Block Explore</title>

    <style>
        .pricename { font-size: 80%; }
        .priceval { font-size: 80%; }
        .valclass { width: 97%; margin-top: 7px; }
        .titleclass { font-size: 80%; vertical-align: center; float: right; }
        h1 { font-size: 1.75em; margin: .67em 0; }
        body { font-family: FreeSans, Arimo, 'Droid Sans', Helvetica, Arial, sans-serif; }

        .search-row {
            display: flex; gap: 10px; align-items: center; margin-bottom: 10px;
        }

        #searchInput {
            flex: 1; padding: 12px; margin: 0;
            box-sizing: border-box; font-size: 16px; font-weight: 500;
            border: 2px solid #999; border-radius: 6px;
            background-color: #f9f9f9;
        }
        #searchInput:focus {
            outline: none; border-color: #0056b3; background-color: #fff;
        }

        .search-controls {
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
            margin-bottom: 10px; font-size: 0.9em;
        }

        .save-section {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 10px; border: 1px solid #bbb; border-radius: 4px;
            background-color: #f5f5f5; flex-shrink: 0;
        }
        .save-section input[type="text"] {
            padding: 4px 8px; border: 1px solid #ccc; border-radius: 3px;
            width: 120px; font-size: 0.9em;
        }
        .save-section button {
            padding: 4px 10px; background: #e0e0e0; color: #555;
            border: 1px solid #ccc; border-radius: 3px; cursor: pointer;
            font-size: 0.9em;
        }
        .save-section button:hover {
            background: #d0d0d0;
        }

        .table-container { margin: 5px 0; }
        /* The table hugs its data instead of stretching to the full page width. */
        #dataTable { width: auto; font-size: 0.85em; }

        #dataTable th, #dataTable td {
            border: 1px solid #ddd; padding: 3px 6px;
            text-align: left; line-height: 1.2;
            box-sizing: border-box;
        }

        /* Data cells stay on one line, so the data alone decides how wide a column is. */
        #dataTable td { white-space: nowrap; }
        /* A long header wraps on a word boundary instead of forcing its column to be wide. */
        #dataTable th { background-color: #f4f4f4; user-select: none; position: sticky; top: 0; padding-top: 6px; padding-bottom: 6px; z-index: 2; white-space: normal; overflow-wrap: anywhere; }
        #dataTable th:hover { background-color: #e0e0e0; }
        /* Alternating rows: only a hint of a shade on every second row. The tint is a background
           image rather than a background colour, so it also shows up on rows whose cells already
           carry a per-species colour. */
        #dataTable tbody tr:nth-child(even) > td {
            background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1));
        }

        /* Header display modes (see the "Headers" control):
           - original: the raw stored key, left exactly as is on a single line, no wrapping.
           - spaced:   "total harvest" style words, laid out vertically as upright letters stacked
                       on top of each other (no rotation of the glyphs).
           - rotated:  the same words, turned -90deg so they read bottom to top. */
        #dataTable.headers-original th {
            white-space: nowrap;
            overflow-wrap: normal;
        }
        /* "spaced" mode stacks the letters one per line. The vertical writing mode sits on an
           inline-block wrapper, not on the table cell: a cell laid out in a vertical writing mode
           does not grow to fit its content, so it used to spill out over the table. As a plain
           inline-block the cell sizes normally and the header row ends up as tall as the tallest
           header. */
        #dataTable th .hdr-stacked {
            display: inline-block;
            writing-mode: vertical-rl;
            text-orientation: upright;
            white-space: nowrap;
            line-height: 1.15;
        }
        /* Start the stacked header at the top of the cell instead of centring it in the tall row. */
        #dataTable.headers-spaced th { vertical-align: top; }
        #dataTable.headers-rotated th {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
            overflow-wrap: normal;
            height: 130px;
        }

        thead tr.avgRow th{ position:sticky; top:35px; background:#fff8d5; font-weight:bold; z-index:1; border-top:2px solid #999; }
        #dataTable tfoot th { position: sticky; top: var(--header-h, 35px); background:#fff8d5; font-weight:bold; z-index:3; border-top:2px solid #999; }

        /* DataTables floats the info, the entries-per-page control and the pager on one line, which
           leaves them on different baselines. Lay that row out as a flex row so they share one
           alignment: info on the left, entries control next, pager on the right. */
        .dataTables_wrapper .top { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
        .dataTables_wrapper .top .dataTables_info,
        .dataTables_wrapper .top .dataTables_length { float: none; padding: 0; margin: 0; }
        .dataTables_wrapper .top .dataTables_paginate { float: none; margin: 0 0 0 auto; padding: 0; }

        .date-filter-controls { display: none; }

        /* --- UPDATED TOOLTIP STYLING TO MATCH GRAPHIC VIEW --- */
        #blockInfoBubble {
            display: none; position: absolute; background: white; border: 1px solid #888;
            padding: 12px; max-width: 600px; max-height: 400px; overflow: auto;
            box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 10000;
            font-family: monospace; font-size: 1.1em; white-space: pre; color: #000; line-height: 1.3;
        }

        .data-content-title { font-size: 1em; font-weight: bold; cursor: pointer; margin: 10px 0; }
        #dataTable td.boldColumn { font-weight: bold; }

        /* Unified navigation: page title on the left, one identical link per page on the right. */
        .page-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .page-header h1 { margin: 0; font-size: 1.5em; color: #0056b3; }
        .viz-nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .viz-nav a, .viz-nav span.active { padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        /* One cheerful colour per view. The current page wears the full colour, the others a light tint. */
        .viz-nav a.nav-block   { background: #d8f3e3; color: #17794a; }
        .viz-nav a.nav-table   { background: #fdecd1; color: #a4670b; }
        .viz-nav a.nav-graphic { background: #ece0fb; color: #6b2fb0; }
        .viz-nav a.nav-block:hover   { background: #2eb872; color: #fff; }
        .viz-nav a.nav-table:hover   { background: #f2a33c; color: #fff; }
        .viz-nav a.nav-graphic:hover { background: #9b51e0; color: #fff; }
        .viz-nav span.active.nav-block   { background: #2eb872; color: #fff; }
        .viz-nav span.active.nav-table   { background: #f2a33c; color: #fff; }
        .viz-nav span.active.nav-graphic { background: #9b51e0; color: #fff; }
        /* The SuperScale link stays a plain link, with no button background. */
        .viz-nav a.home, .viz-nav a.home:hover { background: none; color: #0056b3; }
        .viz-nav a.home:hover { color: #004494; text-decoration: underline; }

        /* --- HIDEABLE COLUMNS --- */
        .col-chooser { position: relative; display: inline-block; }
        .col-chooser > summary {
            cursor: pointer; list-style: none; user-select: none;
            padding: 3px 8px; background: #e8e8e8;
            border: 1px solid #bbb; border-radius: 4px;
        }
        .col-chooser > summary::-webkit-details-marker { display: none; }
        .col-chooser > summary:hover { background: #dcdcdc; }
        .col-chooser[open] > summary { background: #d5e5f5; border-color: #0056b3; }
        .col-chooser-panel {
            position: absolute; z-index: 50; top: 100%; left: 0; margin-top: 4px;
            background: #fff; border: 1px solid #888; border-radius: 4px;
            box-shadow: 0 4px 12px rgba(0,0,0,.25); padding: 6px 10px;
            max-height: 320px; overflow: auto; text-align: left;
        }
        .col-chooser-panel .col-chooser-list { column-width: 140px; }
        .col-chooser-panel label { display: block; white-space: nowrap; padding: 1px 0; font-weight: normal; cursor: pointer; }
        .col-chooser-panel .col-chooser-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        .col-chooser-panel .col-chooser-actions button {
            padding: 1px 6px; background: #e0e0e0; color: #555;
            border: 1px solid #ccc; border-radius: 3px; cursor: pointer;
            font-size: 0.8em; white-space: nowrap;
        }
        .col-chooser-panel .col-chooser-actions button:hover { background: #d0d0d0; }
        .col-chooser-panel .col-chooser-actions .col-toggle-empty,
        .col-chooser-panel .col-chooser-actions .col-toggle-harvest,
        .col-chooser-panel .col-chooser-actions .col-toggle-tags {
            padding: 0 4px; font-size: 0.7em;
        }
        /* Pressed = that group of columns is currently hidden. */
        .col-chooser-panel .col-chooser-actions button.pressed,
        .col-chooser-panel .col-chooser-actions button.pressed:hover {
            background: #b6d2ee; border-color: #0056b3; color: #003b73;
            box-shadow: inset 0 2px 4px rgba(0,0,0,.35);
        }
    </style>

    <script>
        let blockInfoIndex = {};
        var geid = document.getElementById.bind(document);

        function loadRemote(addr, f, err) {
            var xhttp = new XMLHttpRequest();
            xhttp.addEventListener("load", function () { if (this.status != 200) err.bind(this)(); else f.bind(this)(); });
            if (err) xhttp.addEventListener("error", err);
            xhttp.open("GET", addr);
            xhttp.setRequestHeader('x-Date', Math.floor((new Date().getTime()) / 1000));
            xhttp.send();
        }

        // POST helper used to talk to the scale's command endpoints (e.g. /filewrite).
        function postURL(url, params, cb) {
            let body = Object.keys(params).map(function (k) {
                return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
            }).join("&");
            let xhr = new XMLHttpRequest();
            xhr.addEventListener("load", function () { cb(this.responseText, this); });
            xhr.addEventListener("error", function () { cb(null, this); });
            xhr.open("POST", url, true);
            xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            xhr.send(body);
        }

        window.onload = function () {
            loadDataFile();
        };

        var loadingData = false;

        function loadDataFile() {
            if (loadingData) return;
            loadingData = true;
            loadRemote('../data.txt', function () {
                    loadingData = false;
                    dataLoaded.bind(this)(this.response);
                }
                , function () { loadingData = false; geid("content").disabled = true; });
        }

        function removeConsecutiveDuplicates(td) {
            let lines = td.split('\n'); let out = [];
            for (let i = 0; i < lines.length; i++) if (i === 0 || lines[i] !== lines[i - 1]) out.push(lines[i]);
            return out.join('\n');
        }

        function dataLoaded(tdata) {
            geid("textcontent").value = tdata;
            setTimeout(() => {
                let tdata2 = removeCancels(tdata);
                let tdata3 = removeConsecutiveDuplicates(tdata2);

                // FIXED: This line was missing, which broke the tooltip in BlockViz!
                if (typeof buildBlockInfoIndex === 'function') {
                    buildBlockInfoIndex(tdata3);
                }

                processData(tdata3);
            }, 10);
        }

        let dataTableInstance = null;
        // Columns hidden in the request currently being edited (saved/restored with the request).
        let activeHiddenColumns = [];

        // The date condition set in the toolbar, in the shape saved with a request. In relative mode
        // the two number fields count the days back from today and are what gets stored, so the
        // window slides with the calendar; the From/To dates are stored too, so switching back to
        // absolute restores what was typed.
        function collectDateFilter() {
            return {
                enabled: $('#enableDateFilter').is(':checked'),
                column: $('#dateFilterColumn').val(),
                relative: $('#dateFilterRelative').is(':checked'),
                from: $('#dateFrom').val(),
                to: $('#dateTo').val(),
                fromDays: dayOffsetOrNull($('#dateFromDays').val()),
                toDays: dayOffsetOrNull($('#dateToDays').val())
            };
        }

        // Relative mode swaps the two date pickers for the two "days ago" fields.
        function syncDateFilterMode() {
            let relative = $('#dateFilterRelative').is(':checked');
            $('#dateFrom, #dateTo').closest('label').toggle(!relative);
            $('#dateFromDays, #dateToDays').closest('label').toggle(relative);
        }

        // An <input type="date"> value as "days ago" from today, or null when it is empty.
        function dateInputToDaysAgo(value) {
            let d = dateInputToDay(value);
            if (!d) return null;
            let today = new Date();
            today.setHours(0, 0, 0, 0);
            return Math.round((today.getTime() - d.getTime()) / 86400000);
        }

        // Switching mode carries the current window over, so the other pair of fields is
        // pre-filled instead of left empty: dates become "days ago" and vice versa. Both sides
        // stay unbounded (empty) when there was nothing to carry over.
        function onDateFilterModeChange() {
            if ($('#dateFilterRelative').is(':checked')) {
                let fromDays = dateInputToDaysAgo($('#dateFrom').val());
                let toDays = dateInputToDaysAgo($('#dateTo').val());
                $('#dateFromDays').val(fromDays === null ? "" : fromDays);
                $('#dateToDays').val(toDays === null ? "" : toDays);
            } else {
                let fromDays = dayOffsetOrNull($('#dateFromDays').val());
                let toDays = dayOffsetOrNull($('#dateToDays').val());
                $('#dateFrom').val(fromDays === null ? "" : dayOffsetToDate(fromDays));
                $('#dateTo').val(toDays === null ? "" : dayOffsetToDate(toDays));
            }
            syncDateFilterMode();
        }

        // The shared (public) list of requests lives on the scale itself. It is read at the
        // relative URL and written through the /filewrite endpoint at its device path.
        const SERVER_REQUESTS_URL = 'savedRequests.json';
        const SERVER_REQUESTS_PATH = '/viz/savedRequests.json';

        // Everything currently typed in the toolbar, in the shape a saved request has.
        function buildRequestObject(name) {
            return {
                name: name,
                search: $('#searchInput').val(),
                isAnd: $('#searchLogicAnd').is(':checked'),
                hiddenColumns: activeHiddenColumns.slice(),
                dateFilter: collectDateFilter()
            };
        }

        // Replace the request with the same name, or append it when it is new.
        function upsertRequest(list, requestObject) {
            let i = list.findIndex(r => r.name === requestObject.name);
            if (i >= 0) list[i] = requestObject; else list.push(requestObject);
            return list;
        }

        function parseRequestList(text) {
            try {
                let list = JSON.parse(text);
                return Array.isArray(list) ? list : [];
            } catch (e) { return []; }
        }

        function writeServerRequests(list) {
            postURL('/filewrite', { path: SERVER_REQUESTS_PATH, content: JSON.stringify(list, null, 2) }, function (text, xhttp) {
                if (xhttp && xhttp.status === 200) alert("Saved on the scale (shared).\n" + text);
                else alert("Could not save on the scale.\n" + (text || ""));
            });
        }

        // DataTables Global Search logic SCOPED by table ID (Matches Both Files)
        $.fn.dataTable.ext.search.push(function (settings, searchData, index, rowData, counter) {
            let req;
            if (typeof tableFiltersMap !== 'undefined' && tableFiltersMap[settings.nTable.id]) {
                req = tableFiltersMap[settings.nTable.id];
            } else {
                req = {
                    search: $('#searchInput').val(),
                    isAnd: $('#searchLogicAnd').is(':checked'),
                    dateFilter: collectDateFilter()
                };
            }

            let headers = (typeof parsedTableData !== 'undefined' && parsedTableData[0]) ? parsedTableData[0] : window.tableData[0];
            return applyRowFilter(rowData, headers, req);
        });

        // 2. Initialize the table
        function initDataTable() {
            if (dataTableInstance) {
                dataTableInstance.destroy();
                $('#dataTable').empty().append("<tfoot><tr></tr></tfoot>");
            }

            const headers = window.tableData[0];

            let dateSelect = $("#dateFilterColumn");
            dateSelect.empty();
            // Date-like columns: blockdate, *date columns and the tag columns (they hold the tag date).
            headers.forEach(h=>{
                if(h.includes("date") || h=="blockdate" || tagCommands.indexOf(h) >= 0){
                    dateSelect.append($("<option>").val(h).text(h));
                }
            });
            dateSelect.val("blockdate");

            let params = new URLSearchParams(window.location.search);
            let loadReq = params.get('loadReq');
            if (loadReq) {
                let saved = JSON.parse(localStorage.getItem('savedRequests') || "[]");
                let req = saved.find(r => r.name === loadReq);
                if (req) {
                    $('#requestName').val(req.name);
                    $('#searchInput').val(req.search);
                    $('#searchLogicAnd').prop('checked', req.isAnd);
                    $('#enableDateFilter').prop('checked', req.dateFilter.enabled);
                    $('#dateFilterColumn').val(req.dateFilter.column);
                    $('#dateFrom').val(req.dateFilter.from);
                    $('#dateTo').val(req.dateFilter.to);
                    $('#dateFilterRelative').prop('checked', !!req.dateFilter.relative);
                    $('#dateFromDays').val(req.dateFilter.fromDays == null ? "" : req.dateFilter.fromDays);
                    $('#dateToDays').val(req.dateFilter.toDays == null ? "" : req.dateFilter.toDays);
                    syncDateFilterMode();
                    // Restore the column choice saved with this request
                    activeHiddenColumns = (req.hiddenColumns || []).slice();
                }
            }

            let dtHeaders = headers.map((h, colIndex) => ({
                title: prettyHeader(h), defaultContent: "",
                visible: !isColumnHidden(activeHiddenColumns, h),
                className: (h === "id" || h === "blockdate" || h === "totalharvest") ? "boldColumn" : "",
                render: function (data, type, row) {
                    if (data == null) return "";
                    if (h === "BE") {
                        let num = parseFloat(String(data).replace("%",""));
                        if (type === "sort" || type === "type") return num;
                        return data;
                    }
                    // Date cells (blockdate, *date columns and the tag columns, which store the tag date)
                    // are sorted chronologically using the shared D/M/YY parser.
                    let dateTs = makeDate(data).getTime();
                    if (Number.isFinite(dateTs)) {
                        if (type === "sort" || type === "type") return dateTs;
                        return data;
                    }
                    if (h === "Age" || h === "spawn" || h === "totalsubstrate" || h === "totalharvest" || h === "harvestcount" || /^harvest\d+$/.test(h)) {
                        let n = Number(data);
                        if (!isNaN(n) && (type === "sort" || type === "type")) return n;
                    }
                    return data;
                }
            }));

            let dtData = window.tableData.slice(1);
            let footerRow = $("#dataTable tfoot tr");
            headers.forEach(() => { footerRow.append("<th></th>"); });

            buildColumnChooser($("#colChooserPanel"), headers, activeHiddenColumns, function () {
                applyColumnVisibility(headers, activeHiddenColumns, $("#dataTable"));
            }, findEmptyColumns(headers, dtData));

            dataTableInstance = $('#dataTable').DataTable({
                data: dtData,
                columns: dtHeaders,
                footer: true,
                deferRender: true,
                // Let the content decide column widths so the table hugs its data instead of
                // stretching every column to fill the page.
                autoWidth: false,
                pageLength: 50,
                dom: '<"top"ilp>rt<"bottom"p><"clear">',
                order: [],
                scrollX: false,
                footerCallback: function () { updateAverageRow(this.api(), "dataTable", window.tableData[0]); },
                drawCallback: function () {
                    updateAverageRow(this.api(), "dataTable", window.tableData[0]);
                    // Keep the pinned totals row right below the header, whose height depends on
                    // how many lines the (variable-width) headers wrapped onto.
                    syncPinnedRowOffset();
                },
                createdRow: function(row, data, dataIndex) {
                    let speciesIndex = headers.indexOf("species");
                    let color = getSpeciesColor(data[speciesIndex]);
                    if(color) $(row).find("td").css("background-color", color);
                }
            });

            setTimeout(() => { if (dataTableInstance) dataTableInstance.columns.adjust(); }, 50);
            setTimeout(() => { if (dataTableInstance) { dataTableInstance.draw(false); updateAverageRow(dataTableInstance, "dataTable", window.tableData[0]); } }, 500);

            applyHeaderMode();
        }

        // The pinned totals row sticks just below the header; its offset must follow the header height.
        function syncPinnedRowOffset() {
            let headerH = $("#dataTable thead").outerHeight();
            if (headerH) $("#dataTable")[0].style.setProperty("--header-h", headerH + "px");
        }

        // Header display mode (purely visual):
        //   "original" - the raw stored key, unchanged on one line, e.g. "totalharvest"
        //   "spaced"   - readable words, e.g. "total harvest", stacked vertically as upright letters
        //   "rotated"  - the same words, turned -90deg
        function applyHeaderMode() {
            let mode = $("#headerMode").val() || "spaced";
            let headers = window.tableData[0] || [];
            $("#dataTable thead tr").first().children("th").each(function (colIdx) {
                let raw = headers[colIdx];
                if (raw === undefined) return;
                let text = mode === "original" ? raw : prettyHeader(raw);
                if (mode === "spaced") {
                    // Wrap the text so the cell can size itself to the stacked letters.
                    $(this).empty().append($("<span>").addClass("hdr-stacked").text(text));
                } else {
                    $(this).text(text);
                }
            });
            let $table = $("#dataTable");
            $table.toggleClass("headers-original", mode === "original");
            $table.toggleClass("headers-spaced", mode === "spaced");
            $table.toggleClass("headers-rotated", mode === "rotated");
            if (dataTableInstance) dataTableInstance.columns.adjust();
            syncPinnedRowOffset();
        }

        // 3. Bind events & Save Feature
        $(document).ready(function() {
            syncDateFilterMode();
            $('#dateFilterRelative').on('change', onDateFilterModeChange);
            $('#searchInput, #searchLogicAnd, #enableDateFilter, #dateFilterRelative, #dateFilterColumn, #dateFrom, #dateTo, #dateFromDays, #dateToDays').on('input change', function () {
                if (dataTableInstance) dataTableInstance.draw();
            });

            // Header display mode: remembered per browser since it is only a viewing preference.
            let savedHeaderMode = localStorage.getItem('blockVizHeaderMode');
            if (savedHeaderMode) $("#headerMode").val(savedHeaderMode);
            $('#headerMode').on('change', function () {
                localStorage.setItem('blockVizHeaderMode', this.value);
                applyHeaderMode();
            });

            // Save into this browser only (private to this device).
            $('#btnSaveRequest').on('click', function() {
                let name = $('#requestName').val().trim();
                if (!name) { alert("Please enter a name for this request!"); return; }

                let saved = JSON.parse(localStorage.getItem('savedRequests') || "[]");
                upsertRequest(saved, buildRequestObject(name));
                localStorage.setItem('savedRequests', JSON.stringify(saved));
                alert(`Request "${name}" saved in this browser.`);
            });

            // Save onto the scale, where the request is shared with everybody.
            $('#btnSaveRequestServer').on('click', function() {
                let name = $('#requestName').val().trim();
                if (!name) { alert("Please enter a name for this request!"); return; }

                let requestObject = buildRequestObject(name);

                // Read the shared list first, so requests saved by others are kept.
                loadRemote(SERVER_REQUESTS_URL, function () {
                    let list = parseRequestList(this.responseText);
                    upsertRequest(list, requestObject);
                    writeServerRequests(list);
                }, function () {
                    // No shared file on the scale yet: start a fresh list.
                    writeServerRequests(upsertRequest([], requestObject));
                });
            });

            // UPDATED TOOLTIP CLICK LISTENER
            $(document).on('click','#dataTable tbody tr',function(e){
                let row = dataTableInstance.row(this).data();
                if(!row) return;

                let headers = window.tableData[0];
                let idxId = headers.indexOf("id");
                let idxBE = headers.indexOf("BE");
                let idxTotalH = headers.indexOf("totalharvest");
                let idxHarvCount = headers.indexOf("harvestcount");

                let id = row[idxId];
                let be = row[idxBE] ? row[idxBE] : "N/A";
                let totalH = row[idxTotalH] ? row[idxTotalH] + "g" : "0g";
                let hCount = row[idxHarvCount] || 0;

                let info = blockInfoIndex[id];
                let rawLog = info ? info.join("\n") : "No raw data available.";
                let tooltipContent = `harvest: ${totalH}, count: ${hCount}, be: ${be}\n--------------------------\n${rawLog}`;

                let bubble = $("#blockInfoBubble");
                bubble.text(tooltipContent).css({ left:e.pageX+10, top:e.pageY+10 }).show();
            });

            // HIDE TOOLTIP WHEN CLICKING OUTSIDE
            $(document).on('click',function(e){
                if(!$(e.target).closest("#dataTable").length && !$(e.target).closest("#blockInfoBubble").length) {
                    $("#blockInfoBubble").hide();
                }
            });
        });
    </script>
</head>

<div class="page-header">

<div class="table-container">
    <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search rows (type space-separated words, use ! to exclude, e.g. 'compost !flies')...">
        <div class="save-section">
            <input type="text" id="requestName" placeholder="Name request...">
            <button id="btnSaveRequest" title="Saved in this browser only (private)">Save (Browser)</button>
            <button id="btnSaveRequestServer" title="Saved on the scale, shared with everybody">Save (Scale)</button>
        </div>
    </div>

    <div class="search-controls">
        <label>
            <input type="checkbox" id="searchLogicAnd">

        <label><input type="checkbox" id="enableDateFilter"> Date filter</label>

        <details class="col-chooser">

            <div class="col-chooser-panel" id="colChooserPanel"></div>
        </details>
        <label>Headers:
            <select id="headerMode">
                <option value="original">Original</option>
                <option value="spaced" selected>Spaced</option>
                <option value="rotated">Rotated -90&deg;</option>
            </select>
        </label>
    </div>

    <table id="dataTable" class="display">
        <tfoot><tr></tr></tfoot>
    </table>
</div>
<br>

<details>
    <summary class="data-content-title">Data Content</summary>
    <textarea id="textcontent" readonly rows="7" style="margin:5px;width:100%;white-space:pre;">Loading...</textarea>
</details>
<div id="blockInfoBubble"></div>
</body>
