<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script src="BlockVizDataProcess.js"></script>
    <script src="BlockVizCommon.js"></script>

    <title>Saved Requests - Block Viz</title>

    <style>
        body { font-family: FreeSans, Arimo, 'Droid Sans', Helvetica, Arial, sans-serif; padding: 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .page-header a { background: #666; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; }
        .page-header a:hover { background: #444; }

        .request-block { margin-bottom: 50px; background: white; border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .request-title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .request-title-bar h2 { margin: 0; color: #0056b3; }
        .request-title-bar a.edit-btn { background: #0056b3; color: white; padding: 6px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .request-title-bar a.edit-btn:hover { background: #004494; }

        .req-info { font-size: 0.9em; color: #555; margin-bottom: 10px; background: #f9f9f9; padding: 10px; border-radius: 4px; }

        /* Dense Table Styles (Matched to BlockViz) */
        table.dataTable { font-size: 0.85em; width: 100%; border-collapse: collapse; }
        table.dataTable th, table.dataTable td { padding: 3px 6px; white-space: nowrap; box-sizing: border-box; border: 1px solid #ddd; text-align: left; }
        table.dataTable th { background-color: #f4f4f4; position: sticky; top: 0; z-index: 2; padding-top: 6px; padding-bottom: 6px; }
        table.dataTable th:hover { background-color: #e0e0e0; }
        td.boldColumn { font-weight: bold; }

        table.dataTable tfoot th {
            position: sticky;
            top: 35px;
            background: #fff8d5;
            font-weight: bold;
            z-index: 3;
            border-top: 2px solid #999;
        }

        .delete-btn {
            background:#c62828;
            color:white;
            border:none;
            border-radius:4px;
            padding:6px 15px;
            cursor:pointer;
            font-weight:bold;
        }

        .delete-btn:hover {
            background:#a61f1f;
        }
    </style>

    <script>
        // DUMMY JSON: If no real data has been saved yet, we start with these.
        const dummyRequests = [
            { name: "1. Only Enoki (FVn)", search: "FVn", isAnd: false, dateFilter: { enabled: false, column: "blockdate", from: "", to: "" } },
            { name: "2. Compost issues (No flies!)", search: "compost !flies", isAnd: true, dateFilter: { enabled: false, column: "blockdate", from: "", to: "" } }
        ];



        let parsedTableData = [];
        let tableFiltersMap = {};

        $(document).ready(function() {
            let savedDataRaw = localStorage.getItem('savedRequests');
            let savedRequests = savedDataRaw ? JSON.parse(savedDataRaw) : dummyRequests;
            savedRequests.sort((a, b) => a.name.localeCompare(b.name));

            if(savedRequests.length === 0) {
                $('#requestsContainer').html('<p>No requests saved yet.</p>');
                return;
            }

            var xhttp = new XMLHttpRequest();
            xhttp.addEventListener("load", function () {
                if (this.status == 200) {
                    processAndBuildAllTables(this.response, savedRequests);
                }
            });
            xhttp.open("GET", "../dataSub.txt");
            xhttp.send();

            $(document).on("click", ".delete-btn", function () {
                const name = $(this).data("name");
                if (!confirm(`Delete request "${name}" ?`))
                    return;
                let saved = JSON.parse(localStorage.getItem("savedRequests") || "[]");
                saved = saved.filter(r => r.name !== name);
                localStorage.setItem("savedRequests", JSON.stringify(saved));
                location.reload();
            });
        });

        // DataTables Global Search logic SCOPED by table ID
        $.fn.dataTable.ext.search.push(function (settings, searchData, index, rowData, counter) {
            let req = tableFiltersMap[settings.nTable.id];
            if (!req) return true;

            // 1. TEXT SEARCH FILTER
            let input = (req.search || "").toLowerCase();
            let words = input.split(" ").filter(w => w.trim() !== "");
            let matchText = true;

            if (words.length > 0) {
                let rowText = searchData.join(" ").toLowerCase();
                matchText = req.isAnd ? true : false;
                let validWordsCount = 0;

                for (let w of words) {
                    let isNegation = w.startsWith("!");
                    let searchTerm = isNegation ? w.substring(1) : w;
                    if (searchTerm === "") continue;
                    validWordsCount++;

                    let containsTerm = rowText.includes(searchTerm);
                    let conditionMet = isNegation ? !containsTerm : containsTerm;

                    if (req.isAnd) {
                        if (!conditionMet) { matchText = false; break; }
                    } else {
                        if (conditionMet) { matchText = true; break; }
                    }
                }
                if (validWordsCount === 0) matchText = true;
            }

            if (!matchText) return false;

            // 2. DATE FILTER
            if (req.dateFilter && req.dateFilter.enabled) {
                let colName = req.dateFilter.column;
                let colIndex = parsedTableData[0].indexOf(colName);
                if (colIndex >= 0) {
                    let val = rowData[colIndex];
                    if (!val) return false;

                    let p = String(val).split("/");
                    if (p.length !== 3) return false;
                    let rowDate = new Date(2000 + Number(p[2]), Number(p[1])-1, Number(p[0])).getTime();

                    if (req.dateFilter.from && rowDate < new Date(req.dateFilter.from).getTime()) return false;
                    if (req.dateFilter.to && rowDate >= new Date(req.dateFilter.to).getTime() + 86400000) return false;
                }
            }
            return true;
        });





            let dtData = parsedTableData.slice(1);
            let container = $('#requestsContainer');
            let footerHtml = parsedTableData[0].map(() => "<th></th>").join("");

            savedRequests.forEach((req, idx) => {
                let tableId = "dt_" + idx;
                tableFiltersMap[tableId] = req;

                let html = `
                    <div class="request-block">
                        <div class="request-title-bar">
    <h2>${req.name}</h2>

    <div style="display:flex; gap:8px;">
        <button class="delete-btn" data-name="${req.name}">
            Delete
        </button>

        <a href="BlockViz.html?loadReq=${encodeURIComponent(req.name)}"
           class="edit-btn">
            Re-Edit Request →
        </a>
    </div>
</div>
                        <table id="${tableId}" class="display" style="width:100%">
                            <tfoot><tr>${footerHtml}</tr></tfoot>
                        </table>
                    </div>
                `;
                container.append(html);

                $('#' + tableId).DataTable({
                    data: dtData,
                    columns: dtHeaders,
                    footer: true,
                    deferRender: true,
                    pageLength: 10,
                    dom: '<"top"ilp>rt<"bottom"p><"clear">',
                    order: [],
                    scrollX: false,
                    footerCallback: function () {
                        updateAverageRow(this.api(), tableId, parsedTableData[0]);
                    },
                    drawCallback: function () {
                        updateAverageRow(this.api(), tableId, parsedTableData[0]);
                    },
                    createdRow: function(row, data, dataIndex) {
                        let speciesIndex = parsedTableData[0].indexOf("species");
                        let color = getSpeciesColor(data[speciesIndex]);
                        if(color) $(row).find("td").css("background-color", color);
                    }
                });

                setTimeout(() => {
                    if ($.fn.DataTable.isDataTable('#' + tableId)) {
                        $('#' + tableId).DataTable().columns.adjust();
                    }
                }, 50);
            });
        }


        </script>
</head>
<body>

<div class="page-header">
    <h1>Saved Requests</h1>
    <a href="BlockViz.html">← Back to Main Viz</a>
</div>

<div id="requestsContainer">
    <!-- Tables will be dynamically injected here -->
</div>

</body>
</html>
