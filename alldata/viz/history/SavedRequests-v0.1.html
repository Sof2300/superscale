<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <title>Saved Requests - Block Viz</title>

    <style>
        body { font-family: FreeSans, Arimo, 'Droid Sans', Helvetica, Arial, sans-serif; padding: 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .page-header a { background: #666; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; }
        .page-header a:hover { background: #444; }

        .request-block { margin-bottom: 50px; background: white; border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .request-title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .request-title-bar h2 { margin: 0; color: #0056b3; }
        .request-title-bar a.edit-btn { background: #0056b3; color: white; padding: 6px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .request-title-bar a.edit-btn:hover { background: #004494; }

        .req-info { font-size: 0.9em; color: #555; margin-bottom: 10px; background: #f9f9f9; padding: 10px; border-radius: 4px; }

        /* Dense Table Styles (Matched to BlockViz) */
        table.dataTable { font-size: 0.85em; width: 100%; border-collapse: collapse; }
        table.dataTable th, table.dataTable td { padding: 3px 6px; white-space: nowrap; box-sizing: border-box; border: 1px solid #ddd; text-align: left; }
        table.dataTable th { background-color: #f4f4f4; position: sticky; top: 0; z-index: 2; padding-top: 6px; padding-bottom: 6px; }
        table.dataTable th:hover { background-color: #e0e0e0; }
        td.boldColumn { font-weight: bold; }

        table.dataTable tfoot th {
            position: sticky;
            top: 35px;
            background: #fff8d5;
            font-weight: bold;
            z-index: 3;
            border-top: 2px solid #999;
        }
    </style>

    <script>
        // DUMMY JSON: If no real data has been saved yet, we start with these.
        const dummyRequests = [
            { name: "1. Only Enoki (FVn)", search: "FVn", isAnd: false, dateFilter: { enabled: false, column: "blockdate", from: "", to: "" } },
            { name: "2. Compost issues (No flies!)", search: "compost !flies", isAnd: true, dateFilter: { enabled: false, column: "blockdate", from: "", to: "" } }
        ];

        // CONSTANTS & COLORS FROM MAIN VIZ
        const speciesColors = {
            "FVn": "#F3D98A", "POm": "#CFA7F0", "POn": "#B989EA", "POpag": "#A66FE0",
            "PEtun": "#8CC9FF", "PEcorea": "#63B5FF", "PEsal": "#3EA0F2", "PTc": "#2D8BE0",
            "Bpearl": "#225EA8", "BPearl": "#225EA8", "PAb": "#F09A3E", "HEg": "#87C96B",
            "HEn": "#80C98B", "HUn": "#F1E4CC", "HUlcb": "#E3D0B2", "HU22": "#E3D0B2",
            "LE3790": "#E7D1B8", "LEm": "#D7B38C", "LEfr": "#BF8B5D", "LEn": "#A86F3F",
            "PCg": "#F0C94E", "PCme": "#F0C94E", "PSn": "#F08FB0", "PSme": "#F08FB0",
            "Glg": "#D9896B", "Glzam": "#C96D55"
        };
        function getSpeciesColor(species) { return speciesColors[species] || ""; }

        var preorder = ['id', 'species', 'blockdate', 'formula', 'totalsubstrate', 'spawn', 'spawncode', 'Age', 'BE', 'harvest'];
        var sums = ["harvest"];
        var aggregated = { "harvest": 7 };
        var calculatedfields = { "Age": { "substract": ["now", "blockdate"] }, "BE": { "divide": ["totalharvest", "totalsubstrate"] } };
        var formulatosubstrate = {
            "formula": { "Pn2x7": { "totalsubstrate": "1850" }, "Pnx6": { "totalsubstrate": "1580" }, "Pn2x6": { "totalsubstrate": "1580" }, "Pn2×6": { "totalsubstrate": "1580" }, "Pn3x7": { "totalsubstrate": "1850" }, "Pcx7": { "totalsubstrate": "1850" }, "Beechx6 2600h2o": { "totalsubstrate": "1580" }, "Beechx6 3000h2o": { "totalsubstrate": "1580" }, "Pn2x5.5": { "totalsubstrate": "1450" }, "Pn3x6": { "totalsubstrate": "1580" }, "BPcx6 unicorn": { "totalsubstrate": "1580" }, "Ppx7": { "totalsubstrate": "1850" }, "aPpx7": { "totalsubstrate": "1850" }, "Pcx6": { "totalsubstrate": "1580" }, "Pn310x6": { "totalsubstrate": "1415" }, "Ppx6": { "totalsubstrate": "1580" }, "Ppx5.5": { "totalsubstrate": "1450" }, "bPpx5.5": { "totalsubstrate": "1450" }, "aPpx5.5": { "totalsubstrate": "1450" }, "Kx6": { "totalsubstrate": "1580" }, "SDx6": { "totalsubstrate": "1580" }, "bSDx6": { "totalsubstrate": "1580" }, "Oakx6": { "totalsubstrate": "1580" }, "SFtx6": { "totalsubstrate": "1580" }, "SFtx6plus": { "totalsubstrate": "1580" }, "bSFtx6": { "totalsubstrate": "1580" }, "bSFTx6": { "totalsubstrate": "1580" }, "PpBr20Sg10x5.5": { "totalsubstrate": "1450" }, "SFtBr20Sg10x6plus": { "totalsubstrate": "1580" }, "SFtSgx6plus": { "totalsubstrate": "1580" } }
        };

        let parsedTableData = [];
        let tableFiltersMap = {};

        $(document).ready(function() {
            let savedDataRaw = localStorage.getItem('savedRequests');
            let savedRequests = savedDataRaw ? JSON.parse(savedDataRaw) : dummyRequests;
            savedRequests.sort((a, b) => a.name.localeCompare(b.name));

            if(savedRequests.length === 0) {
                $('#requestsContainer').html('<p>No requests saved yet.</p>');
                return;
            }

            var xhttp = new XMLHttpRequest();
            xhttp.addEventListener("load", function () {
                if (this.status == 200) {
                    processAndBuildAllTables(this.response, savedRequests);
                }
            });
            xhttp.open("GET", "../dataSub.txt");
            xhttp.send();
        });

        // DataTables Global Search logic SCOPED by table ID
        $.fn.dataTable.ext.search.push(function (settings, searchData, index, rowData, counter) {
            let req = tableFiltersMap[settings.nTable.id];
            if (!req) return true;

            // 1. TEXT SEARCH FILTER
            let input = (req.search || "").toLowerCase();
            let words = input.split(" ").filter(w => w.trim() !== "");
            let matchText = true;

            if (words.length > 0) {
                let rowText = searchData.join(" ").toLowerCase();
                matchText = req.isAnd ? true : false;
                let validWordsCount = 0;

                for (let w of words) {
                    let isNegation = w.startsWith("!");
                    let searchTerm = isNegation ? w.substring(1) : w;
                    if (searchTerm === "") continue;
                    validWordsCount++;

                    let containsTerm = rowText.includes(searchTerm);
                    let conditionMet = isNegation ? !containsTerm : containsTerm;

                    if (req.isAnd) {
                        if (!conditionMet) { matchText = false; break; }
                    } else {
                        if (conditionMet) { matchText = true; break; }
                    }
                }
                if (validWordsCount === 0) matchText = true;
            }

            if (!matchText) return false;

            // 2. DATE FILTER
            if (req.dateFilter && req.dateFilter.enabled) {
                let colName = req.dateFilter.column;
                let colIndex = parsedTableData[0].indexOf(colName);
                if (colIndex >= 0) {
                    let val = rowData[colIndex];
                    if (!val) return false;

                    let p = String(val).split("/");
                    if (p.length !== 3) return false;
                    let rowDate = new Date(2000 + Number(p[2]), Number(p[1])-1, Number(p[0])).getTime();

                    if (req.dateFilter.from && rowDate < new Date(req.dateFilter.from).getTime()) return false;
                    if (req.dateFilter.to && rowDate >= new Date(req.dateFilter.to).getTime() + 86400000) return false;
                }
            }
            return true;
        });

        function updateAverageRow(api, tableId, headers) {
            const rows = api.rows({search:'applied'}).data().toArray();
            const avgCells = $("#" + tableId + " tfoot th");

            headers.forEach((name, col)=>{
                if (name === "id") { avgCells.eq(col).text("n=" + rows.length); return; }
                let sum = 0, count = 0, isPercent = false;
                rows.forEach(r=>{
                    let v = r[col];
                    if (v === undefined || v === null || v === "") return;
                    if (typeof v === "string" && v.endsWith("%")) {
                        let n = parseFloat(v);
                        if (Number.isFinite(n)) { sum += n; count++; isPercent = true; }
                        return;
                    }
                    if (typeof v === "string" && v.match(/^\d+\/\d+\/\d+$/)) return;
                    if (typeof v === "number") { sum += v; count++; }
                    else if (typeof v === "string" && v.trim() !== "") {
                        if (/^-?\d+(\.\d+)?$/.test(v.trim())) { sum += Number(v); count++; }
                    }
                });
                if(count <= 0 || !Number.isFinite(sum / count)){ avgCells.eq(col).text(""); return; }
                let avg = sum / count;
                avgCells.eq(col).text(isPercent ? avg.toFixed(1)+"%" : avg.toFixed(1));
            });
        }

        function processAndBuildAllTables(rawData, savedRequests) {
            let tdata2 = removeCancels(rawData);
            let tdata3 = removeConsecutiveDuplicates(tdata2);
            var headers = fetchHeaders(2, tdata3);
            var orderedheaders = preorder.slice();
            orderedheaders = [...new Set([...orderedheaders, ...headers])];

            parsedTableData = buildTable(tdata3, orderedheaders, sums, formulatosubstrate);

            let dtHeaders = parsedTableData[0].map((h, colIndex) => ({
                title: h, defaultContent: "",
                className: (h === "id" || h === "blockdate" || h === "totalharvest") ? "boldColumn" : "",
                render: function (data, type, row) {
                    if (data == null) return "";
                    if (h === "BE") {
                        let num = parseFloat(String(data).replace("%",""));
                        if (type === "sort" || type === "type") return num;
                        return data;
                    }
                    if (h === "blockdate" || h.endsWith("date")) {
                        let p = String(data).split("/");
                        if (p.length === 3) {
                            let ts = new Date(2000 + Number(p[2]), Number(p[1])-1, Number(p[0])).getTime();
                            if (type === "sort" || type === "type") return ts;
                        }
                        return data;
                    }
                    if (h === "Age" || h === "spawn" || h === "totalsubstrate" || h === "totalharvest" || h === "harvestcount" || /^harvest\d+$/.test(h)) {
                        let n = Number(data);
                        if (!isNaN(n) && (type === "sort" || type === "type")) return n;
                    }
                    return data;
                }
            }));

            let dtData = parsedTableData.slice(1);
            let container = $('#requestsContainer');
            let footerHtml = parsedTableData[0].map(() => "<th></th>").join("");

            savedRequests.forEach((req, idx) => {
                let tableId = "dt_" + idx;
                tableFiltersMap[tableId] = req;

                let html = `
                    <div class="request-block">
                        <div class="request-title-bar">
                            <h2>${req.name}</h2>
                            <a href="BlockViz.html?loadReq=${encodeURIComponent(req.name)}" class="edit-btn">Re-Edit Request &rarr;</a>
                        </div>
                        <div class="req-info">
                            <strong>Search Terms:</strong> ${req.search || "<em>None</em>"} |
                            <strong>Logic:</strong> ${req.isAnd ? "AND (Require All)" : "OR (Any)"} |
                            <strong>Date Filter:</strong> ${req.dateFilter.enabled ? `${req.dateFilter.column} between ${req.dateFilter.from || "Any"} and ${req.dateFilter.to || "Any"}` : "Disabled"}
                        </div>
                        <table id="${tableId}" class="display" style="width:100%">
                            <tfoot><tr>${footerHtml}</tr></tfoot>
                        </table>
                    </div>
                `;
                container.append(html);

                $('#' + tableId).DataTable({
                    data: dtData,
                    columns: dtHeaders,
                    footer: true,
                    deferRender: true,
                    pageLength: 50,
                    dom: '<"top"ilp>rt<"bottom"p><"clear">',
                    order: [],
                    scrollX: false,
                    footerCallback: function () {
                        updateAverageRow(this.api(), tableId, parsedTableData[0]);
                    },
                    drawCallback: function () {
                        updateAverageRow(this.api(), tableId, parsedTableData[0]);
                    },
                    createdRow: function(row, data, dataIndex) {
                        let speciesIndex = parsedTableData[0].indexOf("species");
                        let color = getSpeciesColor(data[speciesIndex]);
                        if(color) $(row).find("td").css("background-color", color);
                    }
                });

                setTimeout(() => {
                    if ($.fn.DataTable.isDataTable('#' + tableId)) {
                        $('#' + tableId).DataTable().columns.adjust();
                    }
                }, 50);
            });
        }


        // ---------- FULL DATA PROCESSOR PIPELINE ----------
        function splitIntoLines(td) { return td.replaceAll("\r", "").split("\n"); }
        function splitLine(line) {
            let sub = line.split(","); if (sub.length != 4) return null;
            for (let n = 0; n < sub.length; n++) sub[n] = sub[n].trim();
            sub[2] = sub[2].toLowerCase();
            if (sub[2] == "cancel") sub[3] = sub[3].toLowerCase();
            return sub;
        }
        function removeCancels(td) {
            let tde = splitIntoLines(td); let toremove = new Set();
            for (let r = 0; r < tde.length; r++) {
                if (tde[r].length == 0) continue; let sub = splitLine(tde[r]);
                if (sub && sub[2] == "cancel") {
                    for (let k = r - 1; k >= 0; k--) {
                        if (toremove.has(k)) continue; let ksub = tde[k].split(",");
                        if (ksub[1] == sub[1] && (ksub[2] == sub[3] || (sub[3] == "" && ksub[2] != "cancel"))) { toremove.add(k); toremove.add(r); break; }
                    }
                }
            }
            if (toremove.size > 0) { let out = []; for (let i = 0; i < tde.length; i++) if (!toremove.has(i)) out.push(tde[i]); return out.join("\n"); }
            return tde.join("\n");
        }
        function removeConsecutiveDuplicates(td) {
            let lines = td.split('\n'); let out = [];
            for (let i = 0; i < lines.length; i++) if (i === 0 || lines[i] !== lines[i - 1]) out.push(lines[i]);
            return out.join('\n');
        }
        function fetchHeaders(col, data) {
            var arr = data.split("\n"), headers = {};
            for (var r of arr) { if (r.length == 0) continue; headers[r.split(",")[col]] = 1; }
            return Object.keys(headers);
        }
        function buildTable(tdata, headers, sums, transform) {
            var finalheaders = headers.slice(); var finaltable = []; finaltable.push(finalheaders); let arr = splitIntoLines(tdata); var indexofid = {}; var sumlengths = {};
            for (var r of arr) {
                if (r.length == 0) continue; let l = splitLine(r); if(!l) continue;
                if (!(l[1] in indexofid)) { indexofid[l[1]] = finaltable.length; var newrow = []; var idindex = headers.indexOf("id"); if (idindex >= 0) newrow[idindex] = l[1]; finaltable.push(newrow); }
                l[2]=l[2].trim(); var argindex = headers.indexOf(l[2]);
                if (argindex >= 0) { if (sums.indexOf(l[2]) >= 0) { if (finaltable[indexofid[l[1]]][argindex] === undefined) finaltable[indexofid[l[1]]][argindex] = []; finaltable[indexofid[l[1]]][argindex].push([l[0], l[3]]); } else { let tags=["contaminated","compost","flies","fungus flies","spent", "storage", "fruit", "sale synallois","stored"]; let endval=l[3]; if(tags.indexOf(l[2])>-1) endval=l[2]; finaltable[indexofid[l[1]]][argindex] = endval; } }
            }
            for (var r = 1; r < finaltable.length; r++) { for (var f in formulatosubstrate) { var i = finaltable[0].indexOf(f); if (i < 0) continue; let trans = formulatosubstrate[f][finaltable[r][i]]; if (trans === undefined) continue; for (let p in trans) { var pi = finaltable[0].indexOf(p); finaltable[r][pi] = trans[p]; } } }
            for (var r = 1; r < finaltable.length; r++) { for (var s of sums) { var i = finaltable[0].indexOf(s); if (i < 0) continue; let tab = finaltable[r][i]; if (tab === undefined) continue; tab = aggregate(s, tab); finaltable[r][i] = tab; var length = tab.length; if(!sumlengths[s] || sumlengths[s]<length) sumlengths[s] = length; } }
            let extraheader = {};
            for (var s of sums) { var i = finaltable[0].indexOf(s); if (i >= 0) { finaltable[0][i] = "total" + s; finaltable = insertColumn(finaltable, i + 1); finaltable[0][i + 1] = s + "count"; finaltable = insertColumn(finaltable, i + 2); finaltable[0][i + 2] = "last" + s; finaltable = insertColumn(finaltable, i + 3); finaltable[0][i + 3] = "last" + s + "date"; if (sumlengths[s] > 0) extraheader[s] = i + 4; let currentPos = i + 4; for (var suml = 1; suml <= sumlengths[s]; suml++) { finaltable = insertColumn(finaltable, currentPos); finaltable[0][currentPos] = s + suml; currentPos++; finaltable = insertColumn(finaltable, currentPos); finaltable[0][currentPos] = s + suml + "date"; currentPos++; } } }
            for (var r = 1; r < finaltable.length; r++) { for (var s of sums) { var i = finaltable[0].indexOf("total" + s); if (i < 0) continue; let tab = finaltable[r][i], tsum = 0, ind = 0; if (tab === undefined) continue; let lastt; for (var t of tab) { finaltable[r][extraheader[s] + ind * 2] = t[1]; finaltable[r][extraheader[s] + ind * 2 + 1] = t[0]; tsum += Number(t[1]); ind++; lastt = t; } finaltable[r][i] = tsum; finaltable[r][i + 1] = tab.length; if (lastt) { finaltable[r][extraheader[s] - 2] = lastt[1]; finaltable[r][extraheader[s] - 1] = lastt[0]; } } }
            for (var r = 1; r < finaltable.length; r++) { for (var c in calculatedfields) { var target = finaltable[0].indexOf(c); if (target < 0) continue; let op = calculatedfields[c]; let optype = Object.keys(op).pop(); let args = op[optype]; let isdate = false; for (let a of args) if (isDateField(a)) { isdate = true; break; } let argvals = []; function fetchfields(field) { if (field == "now") return formatDate(new Date()); let findex = finaltable[0].indexOf(field); return finaltable[r][findex]; } let stop = false; for (let a of args) { let fv = fetchfields(a); if (fv === undefined) { stop = true; break; } argvals.push(fv); } if (stop) continue; if (optype == "substract") { if (isdate) finaltable[r][target] = daysDiff(argvals[0], argvals[1]); else finaltable[r][target] = argvals[0] - argvals[1]; } if (optype == "divide") finaltable[r][target] = "" + Math.round(100 * argvals[0] / argvals[1]) + "%"; } }
            return finaltable;
        }
        function insertColumn(array, index) { for (var r in array) array[r].splice(index, 0, undefined); return array; }
        function formatDate(d) { return "" + d.getDate() + "/" + (d.getMonth() + 1) + "/" + (d.getFullYear() - 2000); }
        function isDateField(text) { return text.includes("date") || text == "now"; }
        function makeDate(d) { let nd = new Date(0); if (d === undefined) return nd; let datetab = d.split("/"); nd.setDate(datetab[0]); nd.setMonth(datetab[1] - 1); nd.setYear("20" + datetab[2]); return nd; }
        function daysDiff(d1, d2) { return Math.floor((makeDate(d1).getTime() - makeDate(d2).getTime()) / (1000 * 3600 * 24)); }
        function aggregate(name, odata) { function mindist(date, table) { let min; for (let t of table) { let diff = daysDiff(t[0], date); if (min === undefined || diff < min) min = diff; } return min; } function mergedata(tab) { let d = 0, v = 0; for (let t of tab) { if (d == 0 || makeDate(d).getTime() > makeDate(t[0]).getTime()) d = t[0]; v += Number(t[1]); } return [d, v]; } if (!(name in aggregated) || odata === undefined) return odata; var data = odata.slice(); var period = aggregated[name]; var toaggregate = [], ndata = []; while (data.length > 0) { for (var d = 0; d < data.length; d++) { if (toaggregate.length == 0) { toaggregate.push(data[d]); data.splice(d, 1); d--; continue; } if (mindist(data[d][0], toaggregate) <= period) { toaggregate.push(data[d]); data.splice(d, 1); d--; } } ndata.push(mergedata(toaggregate)); toaggregate = []; } return ndata; }
    </script>
</head>

<div class="page-header">
    <h1>Saved Requests</h1>
    <a href="BlockViz.html">← Back to Main Viz</a>
